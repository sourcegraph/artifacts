"""
type BatchChangeAgentWorkspaceReferenceBlock {
    """
    The repository name of the workspace (for example, github.com/org/repo).
    """
    repo: String!

    """
    The working-directory path within the repository, for monorepo workspaces.
    """
    path: String

    """
    The branch the workspace targets.
    """
    branch: String
}

"""
One turn in a batch change agent message.
"""
type BatchChangeAgentTurn implements Node {
    """
    The unique ID for the turn.
    """
    id: ID!

    """
    The sequence number of this turn within the message.
    """
    sequence: Int!

    """
    The role for this turn.
    """
    role: BatchChangeAgentTurnRole!

    """
    Freeform text produced by the role (for example, assistant chain-of-thought
    or assistant text output). This is distinct from content, which stores
    structured typed blocks such as image references.
    """
    reasoning: String

    """
    Extended thinking produced by the model before its assistant text.
    """
    thinking: String

    """
    The ordered structured content blocks for this turn (for example, text
    blocks and image blocks).
    """
    content: [BatchChangeAgentMessageContentBlock!]!

    """
    Structured tool calls emitted by this turn.
    """
    toolCalls: [BatchChangeAgentToolCall!]!

    """
    Structured tool results associated with this turn.
    """
    toolResults: [BatchChangeAgentToolResult!]!

    """
    The error payload for this turn, if any.
    """
    error: BatchChangeAgentError

    """
    Structured stats for this turn.
    """
    stats: BatchChangeAgentLLMStats

    """
    The timestamp when this turn was created.
    """
    createdAt: DateTime!
}

"""
Statistics for LLM usage on a single message or turn.
"""
type BatchChangeAgentLLMStats {
    """
    Wall-clock duration of the LLM execution, in milliseconds.
    """
    timeMillis: Int!

    """
    Number of tool calls emitted.
    """
    toolCalls: Int!

    """
    Total input tokens consumed.
    """
    totalInputTokens: Int!

    """
    Number of cached tokens reused.
    """
    cachedTokens: Int!

    """
    Number of tokens written to the prompt cache.
    """
    cacheCreationInputTokens: Int!

    """
    Number of prompt tokens consumed.
    """
    promptTokens: Int!

    """
    Number of completion tokens produced.
    """
    completionTokens: Int!

    """
    Total tokens consumed (prompt + completion).
    """
    totalTokens: Int!

    """
    Percentage of the model's context window consumed (0-100).
    """
    contextUsagePercent: Int!
}

"""
A single model-emitted tool call.
"""
type BatchChangeAgentToolCall {
    """
    The unique ID of the tool call.
    """
    id: String!

    """
    The name of the tool to invoke.
    """
    name: String!

    """
    The JSON-encoded arguments passed to the tool.
    """
    arguments: String!

    """
    The kind of tool: "function" is a client-provided tool the agent executes,
    "provider" is a provider-executed tool (e.g. web search) that the model
    provider runs inline and that is surfaced for display only. Provider tools
    never produce a tool result, so the client renders them as complete on
    arrival rather than waiting for one.
    """
    type: String!

    """
    The human-approval gate for this tool call, if one was raised. Non-null only
    for approval-gated tool calls (e.g. prepare_batch_spec) that matched a
    server approval policy. While pending, the message is waiting on the user.
    """
    approvalRequest: BatchChangeAgentToolApprovalRequest
}

"""
A human-approval gate raised before an approval-gated tool call runs.
"""
type BatchChangeAgentToolApprovalRequest {
    """
    The human-readable prompt shown to the approver, snapshotted when the gate
    was raised.
    """
    message: String!

    """
    The structured reasons backing the prompt, each shown as a bullet and
    optionally carrying an affected snippet the UI can reveal on demand.
    Snapshotted when the gate was raised; may be empty.
    """
    findings: [BatchChangeAgentToolApprovalFinding!]!

    """
    The approval lifecycle state: one of "pending", "allowed", or
    "changes_requested".
    """
    state: String!

    """
    The human's decision once made, or null while pending.
    """
    decision: BatchChangeAgentToolApprovalDecision

    """
    The human's free-text feedback for a REQUEST_CHANGES decision, if any.
    """
    note: String
}

"""
One structured reason an approval-gated tool call requires approval.
"""
type BatchChangeAgentToolApprovalFinding {
    """
    Stable finding identity used to remember approved items.
    """
    key: String

    """
    The short one-line reason, shown to the approver as a bullet.
    """
    summary: String!

    """
    What the snippet is, e.g. "Run script", "Build image", or "Coding agent".
    Null when the finding has no associated snippet.
    """
    subject: String

    """
    The affected content the UI can reveal on demand (it may be long). Null when
    the finding has no associated snippet.
    """
    snippet: String

    """
    The execution secret names the flagged content references. An ALLOW
    decision with a non-ONCE grant scope grants exactly these names. Empty for
    findings that are not secret-based.
    """
    secrets: [String!]!
}

"""
A single tool result associated with a tool call.
"""
type BatchChangeAgentToolResult {
    """
    The ID of the tool call this result is associated with.
    """
    id: String!

    """
    Free-form structured metadata about the tool result.
    """
    metadata: JSONValue

    """
    The textual content of the tool result.
    """
    content: String!

    """
    A textual error message if the tool failed, otherwise null.
    """
    error: String
}

"""
An error payload used by message and turn records.
"""
type BatchChangeAgentError {
    """
    A short human-readable title for the error.
    """
    title: String!

    """
    The kind of error that occurred.
    """
    kind: BatchChangeAgentErrorKind!

    """
    A human-readable error message.
    """
    message: String!

    """
    Optional additional details about the error.
    """
    details: String
}

"""
The kind of a BatchChangeAgentError.
"""
enum BatchChangeAgentErrorKind {
    """
    The model's token limit was exceeded.
    """
    TOKEN_LIMIT_EXCEEDED

    """
    The model response was truncated before completion.
    """
    RESPONSE_TRUNCATED

    """
    The operation was cancelled.
    """
    CANCELLED

    """
    A rate limit was exceeded.
    """
    RATE_LIMIT_EXCEEDED

    """
    An internal error occurred.
    """
    INTERNAL_ERROR
}

"""
The lifecycle status of a batch change agent message.
"""
enum BatchChangeAgentMessageStatus {
    """
    The message is currently processing.
    """
    PROCESSING

    """
    The message finished successfully.
    """
    COMPLETED

    """
    The message was cancelled.
    """
    CANCELLED

    """
    The message failed.
    """
    FAILED
}

"""
A batch change agent inbox fact kind: the type of event that can be recorded
in a thread's inbox and wake the agent.
"""
enum BatchChangeAgentInboxFactKind {
    """
    A BCA-owned batch spec workspace execution job failed.
    """
    WORKSPACE_EXECUTION_FAILED

    """
    A BCA-owned changeset hook execution job failed.
    """
    WORKSPACE_CHANGESET_HOOK_FAILED

    """
    A BCA-owned changeset hook execution job succeeded.
    """
    WORKSPACE_CHANGESET_HOOK_SUCCEEDED

    """
    A BCA-owned changeset's CI check state transitioned into passed.
    """
    CHANGESET_CI_PASSED
}

"""
The activity status of a batch change agent.
"""
enum BatchChangeAgentStatus {
    """
    Nothing is happening.
    """
    IDLE

    """
    The agent is processing, or the underlying batch change has in-flight work.
    """
    RUNNING

    """
    The agent is waiting for the user to answer a pending ask_user tool call.
    """
    WAITING_FOR_USER
}

"""
The role for one batch change agent turn.
"""
enum BatchChangeAgentTurnRole {
    """
    A turn produced by the end user.
    """
    USER

    """
    A turn produced by the assistant model.
    """
    ASSISTANT

    """
    A turn carrying system instructions.
    """
    SYSTEM

    """
    A turn carrying a tool result back to the assistant.
    """
    TOOL
}
