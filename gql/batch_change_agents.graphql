extend type Query {
    """
    A batch change agent addressed by its public read token.
    """
    batchChangeAgentByReadToken(readToken: String!): BatchChangeAgent

    """
    A batch change agent addressed by its database ID. Resolves only for the
    authenticated owner; returns null otherwise.
    """
    batchChangeAgentByID(id: Int!): BatchChangeAgent
}

extend type User {
    """
    A list of batch change agents owned by this user.

    Only the user themselves and site admins may read this connection.
    """
    batchChangeAgents(
        """
        Returns the first n agents from the list.
        """
        first: Int = 50
        """
        Opaque pagination cursor.
        """
        after: String
        """
        Optional case-insensitive substring filter on the agent title, used to
        search the viewer's own agents (for example, for @@-mention search in
        the prompt editor). When set, first/after paginate over the filtered
        set.
        """
        query: String
    ): BatchChangeAgentConnection!
}

extend type Mutation {
    """
    Creates a new batch change agent and submits the initial user message
    to its first thread.
    """
    createBatchChangeAgent(input: CreateBatchChangeAgentInput!): CreateBatchChangeAgentResult!

    """
    Creates a new empty thread on an existing batch change agent. The thread
    has no messages until submitBatchChangeAgentThreadMessage is called.
    """
    createBatchChangeAgentThread(input: CreateBatchChangeAgentThreadInput!): BatchChangeAgentThread!

    """
    Submits a new message to one thread of a batch change agent.
    """
    submitBatchChangeAgentThreadMessage(
        input: SubmitBatchChangeAgentThreadMessageInput!
    ): BatchChangeAgentThreadMessageReference!

    """
    Submits the user's response to an ask_user tool call and resumes the same
    in-flight batch change agent message. Clients receive the submitted answer
    as a tool_call_complete event for the provided toolCallID.

    If the prompt is no longer active, the mutation returns a GraphQL error
    with extensions.code = BatchChangeAgentAskUserPromptInactive.
    """
    submitBatchChangeAgentAskUserResponse(
        input: SubmitBatchChangeAgentAskUserResponseInput!
    ): BatchChangeAgentThreadMessageReference!

    """
    Submits the user's decision for a pending tool-approval gate (e.g. on
    prepare_batch_spec) and resumes the same in-flight batch change agent
    message. The decision is returned to the agent without running the original
    gated tool call; after ALLOW, the model may issue a follow-up call that runs
    normally.
    """
    submitBatchChangeAgentToolApproval(
        input: SubmitBatchChangeAgentToolApprovalInput!
    ): BatchChangeAgentThreadMessageReference!

    """
    Cancels one in-flight message in a batch change agent thread.
    """
    cancelBatchChangeAgentThreadMessage(
        input: CancelBatchChangeAgentThreadMessageInput!
    ): BatchChangeAgentThreadMessageReference!

    """
    Retries the latest message of a batch change agent thread after it failed
    or was cancelled. The agent resumes from the turns it had already
    persisted; no new user message is created.
    """
    retryBatchChangeAgentThreadMessage(
        input: RetryBatchChangeAgentThreadMessageInput!
    ): BatchChangeAgentThreadMessageReference!

    """
    Permanently deletes one batch change agent owned by the viewer, including
    all of its threads, messages, and turns. Any batch change linked to the
    agent is preserved; only the link from the batch change back to the agent
    is removed.
    """
    deleteBatchChangeAgent(id: ID!): EmptyResponse

    """
    Clears the viewer's standing batch change agent approvals for an executor
    secret while keeping the secret itself. Agents will ask for approval again
    the next time they need it.
    """
    revokeBatchChangeAgentSecretAccess(executorSecret: ID!): EmptyResponse!

    """
    Updates the display title of one batch change agent owned by the viewer,
    replacing it with the provided value. Returns the updated agent.
    """
    updateBatchChangeAgentTitle(input: UpdateBatchChangeAgentTitleInput!): BatchChangeAgent!

    """
    Regenerates the public read token of one batch change agent owned by the
    viewer, invalidating any previously shared link. Returns the updated agent
    carrying the new readToken.
    """
    rotateBatchChangeAgentReadToken(input: RotateBatchChangeAgentReadTokenInput!): BatchChangeAgent!
}

"""
Input for rotateBatchChangeAgentReadToken.
"""
input RotateBatchChangeAgentReadTokenInput {
    """
    The ID of the agent whose read token is being regenerated.
    """
    id: ID!
}

"""
Input for updateBatchChangeAgentTitle.
"""
input UpdateBatchChangeAgentTitleInput {
    """
    The ID of the agent whose title is being updated.
    """
    id: ID!

    """
    The new display title for the agent. Leading and trailing whitespace is
    trimmed; the trimmed value must not be empty.
    """
    title: String!
}

"""
Input for createBatchChangeAgent.
"""
