    The ID of the failed or cancelled message to retry. Must be the latest
    message of its thread.
    """
    messageID: ID!
}

"""
A list of batch change agents.
"""
type BatchChangeAgentConnection {
    """
    A list of batch change agents.
    """
    nodes: [BatchChangeAgent!]!

    """
    The total count of agents in the connection.
    """
    totalCount: Int!

    """
    Pagination information.
    """
    pageInfo: ConnectionPageInfo!
}

"""
A batch change agent.

This is an interface following the visible/hidden pattern also used by
Changeset: it resolves to a VisibleBatchChangeAgent for any viewer with read
access to the agent — the owner, or anyone holding a valid read-token link —
and to a HiddenBatchChangeAgent for a viewer without access, exposing only the
agent's identity. Every detail beyond id and viewerIsOwner lives on
VisibleBatchChangeAgent, so clients must fragment on
`... on VisibleBatchChangeAgent` to read those fields.
"""
interface BatchChangeAgent {
    """
    The unique ID for the batch change agent.
    """
    id: ID!

    """
    The user who owns this agent. Exposed on the shared interface so it is
    readable by every viewer, including those who resolve to
    HiddenBatchChangeAgent.
    """
    owner: User!

    """
    Whether the current viewer owns this agent. False for unauthenticated
    viewers and for logged-in users who reached the agent via its public read
    token. This does not gate the visible/hidden split (read-token viewers
    still get VisibleBatchChangeAgent); clients should use it to disable
    owner-only controls (e.g. the chat input).
    """
    viewerIsOwner: Boolean!
}

"""
A batch change agent that the current viewer cannot read. Only the agent's
identity and the viewerIsOwner flag are exposed; all other details are
withheld.
"""
type HiddenBatchChangeAgent implements Node & BatchChangeAgent {
    """
    The unique ID for the batch change agent.
    """
    id: ID!

    """
    The user who owns this agent.
    """
    owner: User!

    """
    Whether the current viewer owns this agent. Always false for a
    HiddenBatchChangeAgent.
    """
    viewerIsOwner: Boolean!
}

"""
A batch change agent the current viewer can read, exposing its full details.
Returned to the owner and to any viewer holding a valid read-token link.
"""
type VisibleBatchChangeAgent implements Node & BatchChangeAgent {
    """
    The unique ID for the batch change agent.
    """
    id: ID!

    """
    The database ID for the agent. Clients attach it to telemetry events so
    they can be joined to the agent's server-side events.
    """
    databaseID: Int!

    """
    The user who owns this agent.
    """
    owner: User!

    """
    The display title for the agent. This can be null when not set.
    """
    title: String

    """
    A stable token for read-only downstream access, mainly for SSE stream
    snapshots and shared read endpoints consumed by AgentThread-style clients.
    """
    readToken: String!

    """
    Who can find this agent: the owner's choice clamped to the site sharing
    setting.
    """
    visibility: BatchChangeAgentVisibility!

    """
    The activity status of the agent.
    """
    status: BatchChangeAgentStatus!

    """
    The decision the agent is currently paused on, if any.
    """
    pendingDecision: BatchChangeAgentPendingDecision

    """
    When the agent last made progress (latest message activity; falls back
    to creation time).
    """
    lastActivityAt: DateTime!

    """
    The timestamp when the agent was created.
    """
    createdAt: DateTime!

    """
    The timestamp when the agent was last updated.
    """
    updatedAt: DateTime!

    """
    Whether the current viewer owns this agent. True for the owner; false for
    a viewer who reached this agent via a shared read-token link.
    """
    viewerIsOwner: Boolean!

    """
    The batch change associated with this agent, if any has been created
    by the agent's tools. Returns null when the agent has not yet produced
    a batch change.

    Note: this field delegates to the Batch Changes resolvers, which apply
    their own viewer visibility rules (RBAC + namespace permissions).
    A viewer who reached this agent via a shared `readToken` link but
    lacks Batch Changes read permission will get a permission error when
    selecting this field, even though they can see the agent itself.
    """
    batchChange: BatchChange

    """
    The latest materialized batch spec produced by this agent, if any.
    This is the spec that batch change agent tools operate on.

    Note: this field delegates to the Batch Changes resolvers, which apply
    their own viewer visibility rules (RBAC + namespace permissions).
    A viewer who reached this agent via a shared `readToken` link but
    lacks Batch Changes read permission will get a permission error when
    selecting this field, even though they can see the agent itself.
    """
    currentSpec: BatchSpec

    """
    The threads belonging to this agent. The client decides which thread(s)
    to display.
    """
    threads(
        """
        Returns the first n threads from the list.
        """
        first: Int = 50
        """
        Opaque pagination cursor.
        """
        after: String
    ): BatchChangeAgentThreadConnection!
}

"""
A list of batch change agent threads.
"""
type BatchChangeAgentThreadConnection {
    """
    A list of threads.
    """
    nodes: [BatchChangeAgentThread!]!

    """
    The total count of threads in the connection.
    """
    totalCount: Int!

    """
    Pagination information.
    """
    pageInfo: ConnectionPageInfo!
}

"""
One thread within a batch change agent.
"""
type BatchChangeAgentThread implements Node {
    """
    The unique ID for the thread.
    """
    id: ID!

    """
    The database ID for the thread.
    """
    databaseID: Int!

    """
    The display title of the thread.
    """
    title: String!

    """
    The timestamp when the thread was created.
    """
    createdAt: DateTime!

    """
    The timestamp when the thread was last updated.
    """
    updatedAt: DateTime!

    """
    The execution state of this thread. A thread has at most one active run.
    """
    state: BatchChangeAgentThreadState!

    """
    The append-only chronological transcript for this thread. Entries retain
    provider part ordering and include user input, model output, tools,
    compactions, and terminal errors.

    Cursors identify a position in the transcript and are independent of the
    kinds filter. A cursor obtained from a filtered connection can be passed
    to an unfiltered one to fetch the entries surrounding that entry.
    """
    entries(
        """
        Returns the first n transcript entries after the cursor.
        """
        first: Int
        """
        Returns the last n transcript entries before the cursor.
        """
        last: Int
        """
        Opaque cursor after which entries are returned.
        """
        after: String
        """
        Opaque cursor before which entries are returned.
        """
        before: String
        """
        Only return entries of these kinds. When omitted, entries of all kinds
        are returned.
        """
        kinds: [BatchChangeAgentThreadEntryKind!]
    ): BatchChangeAgentThreadEntryConnection!
}

"""
The kind of a batch change agent thread entry. Each kind corresponds to one
implementation of BatchChangeAgentThreadEntry.
"""
enum BatchChangeAgentThreadEntryKind {
    """
    A BatchChangeAgentUserMessageThreadEntry.
    """
    USER_MESSAGE
    """
    A BatchChangeAgentThinkingThreadEntry.
    """
    THINKING
    """
    A BatchChangeAgentAssistantTextThreadEntry.
    """
    ASSISTANT_TEXT
    """
    A BatchChangeAgentToolCallThreadEntry.
    """
    TOOL_CALL
    """
    A BatchChangeAgentToolResultThreadEntry.
    """
    TOOL_RESULT
    """
    A BatchChangeAgentCompactionThreadEntry.
    """
    COMPACTION
    """
    A BatchChangeAgentErrorThreadEntry.
    """
    ERROR
}

"""
The execution state of a batch change agent thread.
"""
enum BatchChangeAgentThreadState {
    IDLE
    PROCESSING
    WAITING_FOR_USER
}

"""
A page of chronological batch change agent transcript entries.
"""
type BatchChangeAgentThreadEntryConnection {
    """
    The transcript entries in this page.
    """
    nodes: [BatchChangeAgentThreadEntry!]!
    """
    The transcript entries in this page, each with its cursor.
    """
    edges: [BatchChangeAgentThreadEntryEdge!]!
    """
    The total number of transcript entries in the thread that match the
    kinds filter.
    """
    totalCount: Int!
    """
    Pagination information for this page.
    """
    pageInfo: ConnectionPageInfo!
}

"""
A batch change agent transcript entry and its position in the transcript.
"""
type BatchChangeAgentThreadEntryEdge {
    """
    Opaque cursor for this entry's position in the transcript. Pass it as
    `after` or `before` to fetch the entries following or preceding this
    entry, with any kinds filter.
    """
    cursor: String!
    """
    The transcript entry.
    """
    node: BatchChangeAgentThreadEntry!
}

"""
One event in a batch change agent thread's chronological transcript.
"""
interface BatchChangeAgentThreadEntry {
    """
    The entry's position in the thread transcript.
    """
    sequence: Int!
    """
    Groups adjacent parts produced by one agent-loop turn.
    """
    groupID: Int!
    """
    The cumulative model usage recorded for this entry.
    """
    stats: BatchChangeAgentLLMStats
    """
    The timestamp when the entry was created.
    """
    createdAt: DateTime!
}

"""
A message identity shared with the thread's event stream.
"""
type BatchChangeAgentThreadMessageReference {
    """
    The message's GraphQL ID.
    """
    id: ID!
    """
    The message's identifier in the thread event stream.
    """
    streamID: Int!
}

"""
A user message in a batch change agent transcript.
"""
type BatchChangeAgentUserMessageThreadEntry implements BatchChangeAgentThreadEntry {
