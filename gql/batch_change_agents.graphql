"""
Input for submitBatchChangeAgentAskUserResponse.
"""
input SubmitBatchChangeAgentAskUserResponseInput {
    """
    The processing message that contains the pending ask_user tool call.
    """
    messageID: ID!

    """
    The model-emitted ask_user tool call ID being answered.
    """
    toolCallID: String!

    """
    Answers keyed by the IDs from the ask_user tool call arguments.
    """
    answers: [BatchChangeAgentAskUserAnswerInput!]!
}

"""
One answer to an ask_user prompt.
"""
input BatchChangeAgentAskUserAnswerInput {
    """
    The question ID from the ask_user tool call arguments.
    """
    id: String!

    """
    The user's answer. For text questions this is the text answer. For options
    questions this is the selected option ID, except freeform options use the
    typed answer. Null, omitted, or blank means the user ignored this question.
    """
    answer: String

    """
    The key of the selected freeform option.
    """
    optionKey: String
}

"""
A human's decision for a pending tool-approval gate. These are the only valid
choices.
"""
enum BatchChangeAgentToolApprovalDecision {
    """
    Approve the gate and return that decision to the agent.
    """
    ALLOW
    """
    Reject the gated tool call but send the agent free-text feedback (note) so
    it can revise and try again.
    """
    REQUEST_CHANGES
}

"""
How far an ALLOW decision extends beyond the gated call itself. Non-ONCE scopes
persist per-secret grants for the secrets named in the approval's findings, so
the approval gate does not ask about those secrets again.
"""
enum BatchChangeAgentToolApprovalGrantScope {
    """
    Approve only this call. The default; no grants are persisted.
    """
    ONCE
    """
    Also grant the findings' secrets to this agent, covering all of its
    threads, for the lifetime of the agent.
    """
    SINGLE_AGENT
    """
    Also grant the findings' secrets to the granting user across all of their
    current and future agents.
    """
    ALL_USER_AGENTS
}

"""
Input for submitBatchChangeAgentToolApproval.
"""
input SubmitBatchChangeAgentToolApprovalInput {
    """
    The processing message that contains the pending, approval-gated tool call.
    """
    messageID: ID!

    """
    The model-emitted tool call ID being approved.
    """
    toolCallID: String!

    """
    The user's decision.
    """
    decision: BatchChangeAgentToolApprovalDecision!

    """
    Free-text feedback for the agent. Required when decision is REQUEST_CHANGES;
    ignored otherwise.
    """
    note: String

    """
    How far an ALLOW decision extends. Non-ONCE values are only valid when
    decision is ALLOW and the approval's findings name at least one secret.
    """
    grantScope: BatchChangeAgentToolApprovalGrantScope = ONCE
}

"""
Input for cancelBatchChangeAgentThreadMessage.
"""
input CancelBatchChangeAgentThreadMessageInput {
    """
    The ID of the message to cancel.
    """
    messageID: ID!
}

"""
A list of batch change agents.
"""
type BatchChangeAgentConnection {
    """
    A list of batch change agents.
    """
    nodes: [BatchChangeAgent!]!

    """
    The total count of agents in the connection.
    """
    totalCount: Int!

    """
    Pagination information.
    """
    pageInfo: ConnectionPageInfo!
}

"""
A batch change agent.

This is an interface following the visible/hidden pattern also used by
Changeset: it resolves to a VisibleBatchChangeAgent for any viewer with read
access to the agent — the owner, or anyone holding a valid read-token link —
and to a HiddenBatchChangeAgent for a viewer without access, exposing only the
agent's identity. Every detail beyond id and viewerIsOwner lives on
VisibleBatchChangeAgent, so clients must fragment on
`... on VisibleBatchChangeAgent` to read those fields.
"""
interface BatchChangeAgent {
    """
    The unique ID for the batch change agent.
    """
    id: ID!

    """
    The user who owns this agent. Exposed on the shared interface so it is
    readable by every viewer, including those who resolve to
    HiddenBatchChangeAgent.
    """
    owner: User!

    """
    Whether the current viewer owns this agent. False for unauthenticated
    viewers and for logged-in users who reached the agent via its public read
    token. This does not gate the visible/hidden split (read-token viewers
    still get VisibleBatchChangeAgent); clients should use it to disable
    owner-only controls (e.g. the chat input).
    """
    viewerIsOwner: Boolean!
}

"""
A batch change agent that the current viewer cannot read. Only the agent's
identity and the viewerIsOwner flag are exposed; all other details are
withheld.
"""
type HiddenBatchChangeAgent implements Node & BatchChangeAgent {
    """
    The unique ID for the batch change agent.
    """
    id: ID!

    """
    The user who owns this agent.
    """
    owner: User!

    """
    Whether the current viewer owns this agent. Always false for a
    HiddenBatchChangeAgent.
    """
    viewerIsOwner: Boolean!
}

"""
A batch change agent the current viewer can read, exposing its full details.
Returned to the owner and to any viewer holding a valid read-token link.
"""
type VisibleBatchChangeAgent implements Node & BatchChangeAgent {
    """
    The unique ID for the batch change agent.
    """
    id: ID!

    """
    The user who owns this agent.
    """
    owner: User!

    """
    The display title for the agent. This can be null when not set.
    """
    title: String

    """
    A stable token for read-only downstream access, mainly for SSE stream
    snapshots and shared read endpoints consumed by AgentThread-style clients.
    """
    readToken: String!

    """
    The activity status of the agent.
    """
    status: BatchChangeAgentStatus!

    """
    The timestamp when the agent was created.
    """
    createdAt: DateTime!

    """
    The timestamp when the agent was last updated.
    """
    updatedAt: DateTime!

    """
    Whether the current viewer owns this agent. True for the owner; false for
    a viewer who reached this agent via a shared read-token link.
    """
    viewerIsOwner: Boolean!

    """
    The batch change associated with this agent, if any has been created
    by the agent's tools. Returns null when the agent has not yet produced
    a batch change.

    Note: this field delegates to the Batch Changes resolvers, which apply
    their own viewer visibility rules (RBAC + namespace permissions).
    A viewer who reached this agent via a shared `readToken` link but
    lacks Batch Changes read permission will get a permission error when
    selecting this field, even though they can see the agent itself.
    """
    batchChange: BatchChange

    """
    The latest materialized batch spec produced by this agent, if any.
    This is the spec that batch change agent tools operate on.

    Note: this field delegates to the Batch Changes resolvers, which apply
    their own viewer visibility rules (RBAC + namespace permissions).
    A viewer who reached this agent via a shared `readToken` link but
    lacks Batch Changes read permission will get a permission error when
    selecting this field, even though they can see the agent itself.
    """
    currentSpec: BatchSpec

    """
    The threads belonging to this agent. The client decides which thread(s)
    to display.
    """
    threads(
        """
        Returns the first n threads from the list.
        """
        first: Int = 50
        """
        Opaque pagination cursor.
        """
        after: String
    ): BatchChangeAgentThreadConnection!
}

"""
A list of batch change agent threads.
"""
type BatchChangeAgentThreadConnection {
    """
    A list of threads.
    """
    nodes: [BatchChangeAgentThread!]!

    """
    The total count of threads in the connection.
    """
    totalCount: Int!

    """
    Pagination information.
    """
    pageInfo: ConnectionPageInfo!
}

"""
One thread within a batch change agent.
"""
type BatchChangeAgentThread implements Node {
    """
    The unique ID for the thread.
    """
    id: ID!

    """
    The database ID for the thread.
    """
    databaseID: Int!

    """
    The display title of the thread.
    """
    title: String!

    """
    The timestamp when the thread was created.
    """
    createdAt: DateTime!

    """
    The timestamp when the thread was last updated.
    """
    updatedAt: DateTime!

    """
    The messages in this thread.
    """
    messages(
        """
        Returns the first n messages from the list.
        """
        first: Int = 50
        """
        Opaque pagination cursor.
        """
        after: String
    ): BatchChangeAgentMessageConnection!

    """
    Compactions recorded for this thread, ordered chronologically (oldest
    cut first). Each compaction marks a point at which earlier turns were
    summarised away from the LLM replay context so the agent loop could
    continue without exceeding the model's context window. The UI uses these
    to render persistent "earlier context summarised" markers between the
    messages whose turns were summarised away. The raw conversation history
    is unaffected.
    """
    compactions(
        """
        Returns the first n compactions from the list.
        """
        first: Int = 50
        """
        Opaque pagination cursor.
        """
        after: String
    ): BatchChangeAgentThreadCompactionConnection!
}

"""
A persisted compaction of a batch change agent thread's earlier turns into
a single summary, used by the LLM replay path when the conversation grows
past the configured trigger ratio of the model's context window.
"""
type BatchChangeAgentThreadCompaction implements Node {
    """
    The Relay-spec global ID for the compaction.
    """
    id: ID!

    """
    The database ID of the compaction row.
    """
    databaseID: Int!

    """
    The highest batch_change_agent_turns.id covered by this compaction's
    summary. Every turn with a larger id survives verbatim in the replay.
    """
    upToTurnID: Int!

    """
    The database ID of the BatchChangeAgentMessage that owns
    upToTurnID. Useful for coarse, message-level divider placement
    in conversation-style UIs.

    Note that a compaction cut is not guaranteed to land on a message
    boundary: when no question-aligned or minimum-tail cut is available
    (e.g. a thread whose first message ended without an assistant
    reply), the cut can fall in the middle of a message's turns. UIs
    that want exact placement should compare upToTurnSequence to the
    message's turn list.
    """
    upToMessageDatabaseID: Int!

    """
    The 1-based sequence number of upToTurnID within its owning
    BatchChangeAgentMessage (matching BatchChangeAgentTurn.sequence).
    UIs use this to tell boundary cuts (sequence == last turn of the
    message) from mid-message cuts so they can either render a divider
    between questions or an inline marker inside the step timeline at
    the cut point.
    """
    upToTurnSequence: Int!

    """
    The compaction summary itself, structured with the agreed section
    headings (GOAL_STATE, DECISIONS_MADE, WORK_COMPLETED, FAILED_APPROACHES,
    UNRESOLVED, ARTIFACTS).
    """
    summary: String!

    """
    The cumulative LLMStats of every turn this compaction summarises,
    accumulated across all preceding compactions.
    """
    stats: BatchChangeAgentLLMStats!

    """
    The LLMStats incurred by producing the summary itself.
    """
    summaryStats: BatchChangeAgentLLMStats!

    """
    The timestamp when the compaction was recorded.
    """
    createdAt: DateTime!
}

"""
A list of batch change agent thread compactions.
"""
type BatchChangeAgentThreadCompactionConnection {
    """
    A list of compactions.
    """
    nodes: [BatchChangeAgentThreadCompaction!]!

    """
    The total count of compactions in the connection.
    """
    totalCount: Int!

    """
    Pagination information.
    """
    pageInfo: ConnectionPageInfo!
}

"""
A list of batch change agent messages.
"""
type BatchChangeAgentMessageConnection {
    """
    A list of messages.
    """
    nodes: [BatchChangeAgentMessage!]!

    """
    The total count of messages in the connection.
    """
    totalCount: Int!

    """
    Pagination information.
    """
    pageInfo: ConnectionPageInfo!
}

"""
One message in a batch change agent thread.

This intentionally mirrors the Deep Search question model fields that are
currently needed by AgentThread-style clients.
Deep Search fields that are not yet exposed here include sources,
suggestedFollowups, and searchContext.
"""
type BatchChangeAgentMessage implements Node {
    """
    The unique ID for the message.
    """
    id: ID!

    """
    The database ID for the message.
    """
    databaseID: Int!

    """
    The sequence number of this message within the thread.
    """
    sequence: Int!

    """
    The ordered structured content blocks composing the original user
    message (for example, text blocks and image blocks).
    """
    content: [BatchChangeAgentMessageContentBlock!]!

    """
    The lifecycle status of the message.
    """
    status: BatchChangeAgentMessageStatus!

    """
    The inbox fact kind that woke the agent to create this message, or null for
    a user-authored message. Drives the "Resumed automatically" notice.
    """
    wakeKind: BatchChangeAgentInboxFactKind

    """
    The final assistant answer for this message.
    Null while processing or when no answer exists.
    """
    answer: String

    """
    The terminal error for this message, if any.
    """
    error: BatchChangeAgentError

    """
    Structured LLM execution stats for this message.
    Null while processing or when no stats were recorded.
    """
    stats: BatchChangeAgentLLMStats

    """
    The timestamp when the message was created.
    """
    createdAt: DateTime!

    """
    The timestamp when the message was last updated.
    """
    updatedAt: DateTime!

    """
    The turn-by-turn trace for this message.
    """
    turns: [BatchChangeAgentTurn!]!
}

"""
A single structured content block in a batch change agent message or turn.
"""
union BatchChangeAgentMessageContentBlock =
    | BatchChangeAgentTextBlock
    | BatchChangeAgentImageBlock
    | BatchChangeAgentFileBlock
    | BatchChangeAgentDiffCommentBlock
    | BatchChangeAgentWorkspaceReferenceBlock

"""
A text content block.
"""
type BatchChangeAgentTextBlock {
    """
    The text content of the block.
    """
