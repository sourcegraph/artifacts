extend type Query {
    """
    A batch change agent addressed by its public read token.
    """
    batchChangeAgentByReadToken(readToken: String!): BatchChangeAgent

    """
    A batch change agent addressed by its database ID. Resolves only for the
    authenticated owner; returns null otherwise.
    """
    batchChangeAgentByID(id: Int!): BatchChangeAgent

    """
    Batch change agents the viewer can discover across all owners (GLOBAL
    agents plus the viewer's own LINK_ONLY ones), with the same filter and
    sort arguments as User.batchChangeAgents.
    Each node resolves to VisibleBatchChangeAgent, including its readToken, so
    any viewer with Batch Changes read permission can open any listed agent.

    Gated by the experimentalFeatures.batchChanges.agenticBatchChanges.sharing
    site setting; unless it is "global" the connection is empty and totalCount
    is 0.
    """
    batchChangeAgents(
        """
        Returns the first n agents from the list.
        """
        first: Int = 50
        """
        Opaque pagination cursor.
        """
        after: String
        """
        Optional case-insensitive substring filter on the agent title. When
        set, first/after paginate over the filtered set.
        """
        query: String
        """
        Optional filter restricting results to agents whose derived status is
        one of these values.
        """
        status: [BatchChangeAgentStatus!]
        """
        Optional filter restricting results to agents owned by this user.
        Omitted or null lists agents of every owner.
        """
        owner: ID
        """
        Ordering of the returned agents. Defaults to CREATED_DESC when omitted
        or null; see User.batchChangeAgents.sort for why there is no schema
        default value.
        """
        sort: BatchChangeAgentsSortOrder
    ): BatchChangeAgentConnection!

    """
    Users who own at least one agent listed by batchChangeAgents, ordered by
    username, for the owner filter of the global agent list. Gated like
    batchChangeAgents: empty unless the
    experimentalFeatures.batchChanges.agenticBatchChanges.sharing site setting
    is "global".
    """
    batchChangeAgentOwners(
        """
        Optional case-insensitive substring filter on username or display name.
        """
        query: String
        """
        Returns at most this many owners; omitted or null means 10 (maximum
        100). No schema default value: graphql-go cannot apply one to the
        nullable argument.
        """
        first: Int
    ): [User!]!
}

extend type User {
    """
    A list of batch change agents owned by this user.

    Only the user themselves and site admins may read this connection.
    """
    batchChangeAgents(
        """
        Returns the first n agents from the list.
        """
        first: Int = 50
        """
        Opaque pagination cursor.
        """
        after: String
        """
        Optional case-insensitive substring filter on the agent title, used to
        search the viewer's own agents (for example, for @@-mention search in
        the prompt editor). When set, first/after paginate over the filtered
        set.
        """
        query: String
        """
        Optional filter restricting results to agents whose derived status is
        one of these values.
        """
        status: [BatchChangeAgentStatus!]
        """
        Ordering of the returned agents. Defaults to CREATED_DESC (most
        recently created first) when omitted or null — not declared as a
        schema default value, because a caller whose query binds this
        argument to a variable that resolves to null (the variable is
        declared but left out of `variables`, which is common and spec-legal)
        would bypass a schema-level default entirely; only an argument that's
        syntactically absent from the query document gets that default.
        """
        sort: BatchChangeAgentsSortOrder
    ): BatchChangeAgentConnection!
}

extend type Mutation {
    """
    Creates a new batch change agent and submits the initial user message
    to its first thread.
    """
    createBatchChangeAgent(input: CreateBatchChangeAgentInput!): CreateBatchChangeAgentResult!

    """
    Creates a new empty thread on an existing batch change agent. The thread
    has no messages until submitBatchChangeAgentThreadMessage is called.
    """
    createBatchChangeAgentThread(input: CreateBatchChangeAgentThreadInput!): BatchChangeAgentThread!

    """
    Submits a new message to one thread of a batch change agent.
    """
    submitBatchChangeAgentThreadMessage(
        input: SubmitBatchChangeAgentThreadMessageInput!
    ): BatchChangeAgentThreadMessageReference!

    """
    Submits the user's response to an ask_user tool call and resumes the same
    in-flight batch change agent message. Clients receive the submitted answer
    as a tool_call_complete event for the provided toolCallID.

    If the prompt is no longer active, the mutation returns a GraphQL error
    with extensions.code = BatchChangeAgentAskUserPromptInactive.
    """
    submitBatchChangeAgentAskUserResponse(
        input: SubmitBatchChangeAgentAskUserResponseInput!
    ): BatchChangeAgentThreadMessageReference!

    """
    Submits the user's decision for a pending tool-approval gate (e.g. on
    prepare_batch_spec) and resumes the same in-flight batch change agent
    message. The decision is returned to the agent without running the original
    gated tool call; after ALLOW, the model may issue a follow-up call that runs
    normally.
    """
    submitBatchChangeAgentToolApproval(
        input: SubmitBatchChangeAgentToolApprovalInput!
    ): BatchChangeAgentThreadMessageReference!

    """
    Cancels one in-flight message in a batch change agent thread.
    """
    cancelBatchChangeAgentThreadMessage(
        input: CancelBatchChangeAgentThreadMessageInput!
    ): BatchChangeAgentThreadMessageReference!

    """
    Retries the latest message of a batch change agent thread after it failed
    or was cancelled. The agent resumes from the turns it had already
    persisted; no new user message is created.
    """
    retryBatchChangeAgentThreadMessage(
        input: RetryBatchChangeAgentThreadMessageInput!
    ): BatchChangeAgentThreadMessageReference!

    """
    Permanently deletes one batch change agent owned by the viewer, including
    all of its threads, messages, and turns. Any batch change linked to the
    agent is preserved; only the link from the batch change back to the agent
    is removed.
    """
    deleteBatchChangeAgent(id: ID!): EmptyResponse

    """
    Clears the viewer's standing batch change agent approvals for an executor
    secret while keeping the secret itself. Agents will ask for approval again
    the next time they need it.
    """
    revokeBatchChangeAgentSecretAccess(executorSecret: ID!): EmptyResponse!

    """
    Updates the display title of one batch change agent owned by the viewer,
    replacing it with the provided value. Returns the updated agent.
    """
    updateBatchChangeAgentTitle(input: UpdateBatchChangeAgentTitleInput!): BatchChangeAgent!

    """
    Regenerates the public read token of one batch change agent owned by the
    viewer, invalidating any previously shared link. Returns the updated agent
    carrying the new readToken.
    """
    rotateBatchChangeAgentReadToken(input: RotateBatchChangeAgentReadTokenInput!): BatchChangeAgent!

    """
    Sets who can find an agent owned by the viewer. GLOBAL is only accepted
    while the site sharing setting is "global". Returns the updated agent.
    """
    updateBatchChangeAgentVisibility(input: UpdateBatchChangeAgentVisibilityInput!): BatchChangeAgent!

    """
    Queues workspaces in an agent's current materialized batch spec: the
    workspaces matching the filter, plus the included ones, minus the excluded
    ones. At least one of filter and includedWorkspaceIDs must be set. The
    request ID makes transport retries idempotent. The action is recorded
    in the agent's inbox; it does not wake the agent.
    Returns a GraphQL error with one of these extension codes:
    BatchChangeAgentWorkspaceActionRefused when the server definitively refuses
    the action without a durable write,
    BatchChangeAgentWorkspaceActionStaleBatchSpec when expectedBatchSpecID is
    no longer current, BatchChangeAgentWorkspaceActionNoBatchSpec when the
    agent has no materialized batch spec, and
    BatchChangeAgentWorkspaceActionRequestIDReused when requestID was already
    used with different input.
    """
    runBatchChangeAgentWorkspaces(input: RunBatchChangeAgentWorkspacesInput!): RunBatchChangeAgentWorkspacesPayload!

    """
    Applies and publishes selected workspace output in one idempotent action.
    The action is recorded in the agent's inbox; it does not wake the agent.
    The request ID should be retained when retrying an uncertain response.
    Returns a GraphQL error with one of these extension codes:
    BatchChangeAgentWorkspaceActionRefused when the server definitively refuses
    the action without a durable write,
    BatchChangeAgentWorkspaceActionStaleBatchSpec when expectedBatchSpecID is
    no longer current, BatchChangeAgentWorkspaceActionNoBatchSpec when the agent
    has no materialized batch spec, and
    BatchChangeAgentWorkspaceActionRequestIDReused when requestID was already
    used with different input. Publication limits and quota refuse the action
    without a durable write with the batches publish-gate codes
    (ErrBatchChangeAgentPublish*, ErrBatchChangeAgentQuota*).
    """
    publishBatchChangeAgentWorkspaces(
        input: PublishBatchChangeAgentWorkspacesInput!
    ): PublishBatchChangeAgentWorkspacesPayload!
}

"""
Input for directly publishing selected Agentic Batch Changes workspaces.
"""
input PublishBatchChangeAgentWorkspacesInput {
    """
    The agent whose current materialized batch spec should be published.
    """
    agentID: ID!

    """
    The batch spec visible when the user initiated the action.
    """
    expectedBatchSpecID: ID!

    """
    Selected workspaces belonging to expectedBatchSpecID.
    """
    includedWorkspaceIDs: [ID!]!

    """
    Whether to publish ready or draft changesets, or push branches only.
    """
    mode: BatchChangeAgentPublicationMode!

    """
    A client-generated UUID retained when retrying an uncertain request.
    Replaying it with identical input returns the original result, including
    per-workspace rejections such as PUBLICATION_PENDING. A new user-initiated
    attempt must use a new UUID.
    """
    requestID: String!
}

"""
How a direct Publish opens selected workspaces on the code host.
"""
enum BatchChangeAgentPublicationMode {
    """
    Open changesets ready for review.
    """
    READY
    """
    Open draft changesets. The request is refused before anything is published
    when a selected workspace's code host type does not support draft changesets.
    """
    DRAFT
    """
    Push branches without opening changesets. The request is refused before
    anything is pushed when a selected workspace's code host type does not support
    pushing a branch.
    """
    BRANCH
}

"""
The selected workspaces whose publication was queued or skipped.
"""
type PublishBatchChangeAgentWorkspacesPayload {
    """
    Workspace IDs accepted because publication jobs were queued or Apply updated
    their changesets.
    """
    queuedWorkspaceIDs: [ID!]!

    """
    Selected workspaces with a rejection, grouped by reason. A workspace rejected as
    PUBLICATION_PENDING can also be in queuedWorkspaceIDs.
    """
    rejected: [BatchChangeAgentWorkspaceRejectionGroup!]!
}

"""
Input for directly running selected Agentic Batch Changes workspaces.
"""
input RunBatchChangeAgentWorkspacesInput {
    """
    The agent whose current materialized batch spec should run.
    """
    agentID: ID!

    """
    The batch spec visible when the user initiated the action.
    """
    expectedBatchSpecID: ID!

    """
    Every workspace of expectedBatchSpecID that the workspace list shows for
    this filter, resolved when the action runs. An empty filter matches every
    workspace.
    """
    filter: BatchChangeAgentWorkspaceFilterInput

    """
    Workspaces of expectedBatchSpecID to run in addition to the filter's
    matches.
    """
    includedWorkspaceIDs: [ID!]

    """
    Workspaces not to run, even when they match the filter or are included.
    """
    excludedWorkspaceIDs: [ID!]

    """
    A client-generated UUID retained when retrying an uncertain request.
    Replaying it with identical input returns the original result, including
    per-workspace rejections such as RETRY_FAILED. A new user-initiated
    attempt must use a new UUID.
    """
    requestID: String!
}

"""
The filter arguments of BatchSpecWorkspaceResolution.workspaces.
"""
input BatchChangeAgentWorkspaceFilterInput {
    """
    The search argument of BatchSpecWorkspaceResolution.workspaces.
    """
    search: String

    """
    The state argument of BatchSpecWorkspaceResolution.workspaces.
    """
    state: BatchSpecWorkspaceState
}

"""
The result of directly running selected workspaces.
"""
type RunBatchChangeAgentWorkspacesPayload {
    """
    Workspace IDs that were queued for execution.
    """
    queuedWorkspaceIDs: [ID!]!

    """
    Selected workspaces that could not be queued, grouped by reason. Every
    selected workspace is in queuedWorkspaceIDs or in exactly one group.
    """
    rejected: [BatchChangeAgentWorkspaceRejectionGroup!]!
}

"""
Selected workspaces rejected for the same reason.
"""
type BatchChangeAgentWorkspaceRejectionGroup {
    """
    A stable machine-readable rejection reason.
    """
    code: BatchChangeAgentWorkspaceActionRejectionCode!

    """
    The workspaces rejected for this reason.
    """
    workspaceIDs: [ID!]!
}

"""
Reasons a selected workspace may not be queued.
"""
enum BatchChangeAgentWorkspaceActionRejectionCode {
    WORKSPACE_NOT_FOUND
    CACHED_RESULT
    SKIPPED
    IGNORED
    UNSUPPORTED
    ALREADY_HAS_EXECUTION
    NO_LONGER_EXECUTABLE
    RETRY_FAILED
    REPO_EXCLUDED
    """
    The selected changeset is already published.
    """
    ALREADY_PUBLISHED
    """
    The selected changeset was already pushed as a branch.
    """
    ALREADY_PUSHED
    """
    The selected workspace has no changeset changes to publish.
    """
    NO_CHANGES
    """
    A publication of a selected changeset is still pending: a queued job or an
    unfinished reconcile. That changeset gets no second job; Apply still applies
    any newer results, which the pending publication publishes. The workspace's
    other changesets are queued as usual; when one is, the workspace is also in
    queuedWorkspaceIDs and the inbox record.
    """
    PUBLICATION_PENDING
}

