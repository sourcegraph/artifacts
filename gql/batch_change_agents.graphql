"""
A human's decision for a pending tool-approval gate. These are the only valid
choices.
"""
enum BatchChangeAgentToolApprovalDecision {
    """
    Approve the gate and return that decision to the agent.
    """
    ALLOW
    """
    Reject the gated tool call but send the agent free-text feedback (note) so
    it can revise and try again.
    """
    REQUEST_CHANGES
}

"""
How far an ALLOW decision extends beyond the gated call itself. Non-ONCE scopes
persist per-secret grants for the secrets named in the approval's findings, so
the approval gate does not ask about those secrets again.
"""
enum BatchChangeAgentToolApprovalGrantScope {
    """
    Approve only this call. The default; no grants are persisted.
    """
    ONCE
    """
    Also grant the findings' secrets to this agent, covering all of its
    threads, for the lifetime of the agent.
    """
    SINGLE_AGENT
    """
    Also grant the findings' secrets to the granting user across all of their
    current and future agents.
    """
    ALL_USER_AGENTS
}

"""
Input for submitBatchChangeAgentToolApproval.
"""
input SubmitBatchChangeAgentToolApprovalInput {
    """
    The processing message that contains the pending, approval-gated tool call.
    """
    messageID: ID!

    """
    The model-emitted tool call ID being approved.
    """
    toolCallID: String!

    """
    The user's decision.
    """
    decision: BatchChangeAgentToolApprovalDecision!

    """
    Free-text feedback for the agent. Required when decision is REQUEST_CHANGES;
    ignored otherwise.
    """
    note: String

    """
    How far an ALLOW decision extends. Non-ONCE values are only valid when
    decision is ALLOW and the approval's findings name at least one secret.
    """
    grantScope: BatchChangeAgentToolApprovalGrantScope = ONCE
}

"""
Input for cancelBatchChangeAgentThreadMessage.
"""
input CancelBatchChangeAgentThreadMessageInput {
    """
    The ID of the message to cancel.
    """
    messageID: ID!
}

