    are accepted.
    """
    url: String

    """
    Existing file path in the agent virtual filesystem. Set this instead of
    url when resubmitting a previously uploaded file reference, such as on
    retry.
    """
    path: String

    """
    MIME type for an existing file reference. Required with path.
    """
    mimeType: String

    """
    Byte size for an existing file reference. Required with path.
    """
    byteSize: Int
}

