    stats: BatchChangeAgentLLMStats
    """
    The timestamp when the entry was created.
    """
    createdAt: DateTime!
    """
    The model-generated summary of the compacted entries.
    """
    summary: String!
    """
    The cumulative model usage through the compaction cutoff.
    """
    cumulativeStats: BatchChangeAgentLLMStats!
    """
    The model usage consumed while generating the summary.
    """
    summaryStats: BatchChangeAgentLLMStats!
}

"""
A terminal error in a batch change agent transcript.
"""
type BatchChangeAgentErrorThreadEntry implements BatchChangeAgentThreadEntry {
    """
    The entry's position in the thread transcript.
    """
    sequence: Int!
    """
    The agent-loop turn that produced this entry.
    """
    groupID: Int!
    """
    The cumulative model usage recorded for this entry.
    """
    stats: BatchChangeAgentLLMStats
    """
    The timestamp when the entry was created.
    """
    createdAt: DateTime!
    """
    The status associated with the terminal error.
    """
    status: String!
    """
    A description of the error.
    """
    message: String!
}
"""
A non-text attachment to a user message.
"""
union BatchChangeAgentAttachment =
    | BatchChangeAgentImageBlock
    | BatchChangeAgentFileBlock
    | BatchChangeAgentDiffCommentBlock
    | BatchChangeAgentWorkspaceReferenceBlock
    | BatchChangeAgentConversationReferenceBlock

"""
An image content block.
"""
type BatchChangeAgentImageBlock {
    """
    Image data URL (for example, data:image/png;base64,...).
    """
    url: String!
}

"""
A file content block referencing a user-uploaded text file. The file's bytes
live in the agent virtual filesystem and are not returned here.
"""
type BatchChangeAgentFileBlock {
    """
    The original file name (for example, data.csv).
    """
    name: String!

    """
    The detected MIME type of the file (for example, text/csv).
    """
    mimeType: String!

    """
    The size of the file in bytes.
    """
    byteSize: Int!

    """
    The file's path within the agent virtual filesystem. Combined with the
    agent's read token, this addresses the file for authenticated download via
    the /.api/agent-files/v1 endpoint by viewers who can access the shared
    batch change agent.
    """
    path: String!
}

"""
A diff comment content block.
"""
type BatchChangeAgentDiffCommentBlock {
    """
    The repository that the diff belongs to.
    """
    repo: String!

    """
    The base revision of the diff.
    """
    base: String!

    """
    The head revision of the diff.
    """
    head: String!

    """
    The old path of the file, or null if the file was added.
    """
    oldPath: String

    """
    The new path of the file, or null if the file was deleted.
    """
    newPath: String

    """
    The user's comment attached to this diff selection.
    """
    comment: String!

    """
    The exact diff text selected by the user.
    """
    source: String!

    """
    The start line of the selection on startSide.
    """
    startLine: Int!

    """
    The side that startLine belongs to.
    """
    startSide: BatchChangeAgentDiffSide!

    """
    The end line of the selection on endSide.
    """
    endLine: Int!

    """
    The side that endLine belongs to.
    """
    endSide: BatchChangeAgentDiffSide!
}

"""
A workspace reference content block. Identifies a workspace the user selected
in the workspace explorer when composing the message.
"""
type BatchChangeAgentWorkspaceReferenceBlock {
    """
    The repository name of the workspace (for example, github.com/org/repo).
    """
    repo: String!

    """
    The working-directory path within the repository, for monorepo workspaces.
    """
    path: String

    """
    The branch the workspace targets.
    """
    branch: String
}

"""
A reference to another batch change agent conversation. Identifies the agent
the user @@ mentioned in the prompt editor when composing this message.
"""
type BatchChangeAgentConversationReferenceBlock {
    """
    The title of the referenced agent conversation, snapshotted at mention
    time.
    """
    title: String!

    """
    The read token of the referenced agent, used by the agent to fetch the
    referenced conversation's content.
    """
    readToken: String!
}

"""
Statistics for LLM usage on a transcript entry.
"""
type BatchChangeAgentLLMStats {
    """
    Wall-clock duration of the LLM execution, in milliseconds.
    """
    timeMillis: Int!

    """
    Number of tool calls emitted.
    """
    toolCalls: Int!

    """
    Total input tokens consumed.
    """
    totalInputTokens: Int!

    """
    Number of cached tokens reused.
    """
    cachedTokens: Int!

    """
    Number of tokens written to the prompt cache.
    """
    cacheCreationInputTokens: Int!

    """
    Number of prompt tokens consumed.
    """
    promptTokens: Int!

    """
    Number of completion tokens produced.
    """
    completionTokens: Int!

    """
    Total tokens consumed (prompt + completion).
    """
    totalTokens: Int!

    """
    Percentage of the model's context window consumed (0-100).
    """
    contextUsagePercent: Int!
}

"""
A human-approval gate raised before an approval-gated tool call runs.
"""
type BatchChangeAgentToolApprovalRequest {
    """
    The human-readable prompt shown to the approver, snapshotted when the gate
    was raised.
    """
    message: String!

    """
    The structured reasons backing the prompt, each shown as a bullet and
    optionally carrying an affected snippet the UI can reveal on demand.
    Snapshotted when the gate was raised; may be empty.
    """
    findings: [BatchChangeAgentToolApprovalFinding!]!

    """
    The approval lifecycle state: one of "pending", "allowed", or
    "changes_requested".
    """
    state: String!

    """
    The human's decision once made, or null while pending.
    """
    decision: BatchChangeAgentToolApprovalDecision

    """
    The human's free-text feedback for a REQUEST_CHANGES decision, if any.
    """
    note: String
}

"""
One structured reason an approval-gated tool call requires approval.
"""
type BatchChangeAgentToolApprovalFinding {
    """
    Stable finding identity used to remember approved items.
    """
    key: String

    """
    The short one-line reason, shown to the approver as a bullet.
    """
    summary: String!

    """
    What the snippet is, e.g. "Run script", "Build image", or "Coding agent".
    Null when the finding has no associated snippet.
    """
    subject: String

    """
    The affected content the UI can reveal on demand (it may be long). Null when
    the finding has no associated snippet.
    """
    snippet: String

    """
    The execution secret names the flagged content references. An ALLOW
    decision with a non-ONCE grant scope grants exactly these names. Empty for
    findings that are not secret-based.
    """
    secrets: [String!]!
}

"""
A batch change agent inbox fact kind: the type of event that can be recorded
in a thread's inbox and wake the agent.
"""
enum BatchChangeAgentInboxFactKind {
    """
    A BCA-owned batch spec workspace execution job failed.
    """
    WORKSPACE_EXECUTION_FAILED

    """
    A BCA-owned changeset hook execution job failed.
    """
    WORKSPACE_CHANGESET_HOOK_FAILED

    """
    A BCA-owned changeset hook execution job succeeded.
    """
    WORKSPACE_CHANGESET_HOOK_SUCCEEDED

    """
    A BCA-owned changeset's check state transitioned into passed.
    The product calls these "checks" to stay agnostic to the system producing
    them; "CI" remains in this enum value only for backward compatibility.
    """
    CHANGESET_CI_PASSED

    """
    A BCA-owned changeset's check state transitioned into failed.
    The product calls these "checks" to stay agnostic to the system producing
    them; "CI" remains in this enum value only for backward compatibility.
    """
    CHANGESET_CI_FAILED
}

"""
The kind of decision a batch change agent is paused on.
"""
enum BatchChangeAgentPendingDecisionKind {
    """
    The agent asked the user one or more questions via the ask_user tool.
    Answer with submitBatchChangeAgentAskUserResponse.
    """
    QUESTION

    """
    The agent raised a human-approval gate for a tool call. Decide with
    submitBatchChangeAgentToolApproval.
    """
    APPROVAL
}

"""
A decision a batch change agent is durably paused on, waiting for a human.
"""
type BatchChangeAgentPendingDecision {
    """
    The kind of decision.
    """
    kind: BatchChangeAgentPendingDecisionKind!

    """
    The processing message paused on this decision. Its ID is the input for
    answer/approval mutations.
    """
    message: BatchChangeAgentThreadMessageReference!

    """
    The ask_user tool call (QUESTION) or the gated tool call carrying
    approvalRequest (APPROVAL).
    """
    toolCall: BatchChangeAgentToolCallThreadEntry!

    """
    When the agent started waiting on this decision.
    """
    waitingSince: DateTime!
}

"""
The activity status of a batch change agent.
"""
enum BatchChangeAgentStatus {
    """
    Nothing is happening.
    """
    IDLE

    """
    The agent is processing, or the underlying batch change has in-flight work.
    """
    RUNNING

    """
    The agent is waiting for the user to answer a pending ask_user tool call.
    """
    WAITING_FOR_USER
}
