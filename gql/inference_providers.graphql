extend type Query {
    """
    Inference provider and model-routing configuration.
    """
    inference: InferenceConfiguration!
}

"""
Inference provider and model-routing configuration.
"""
type InferenceConfiguration {
    """
    The configured inference providers.
    """
    providers(first: Int, after: String, last: Int, before: String): InferenceProviderConnection!
    """
    Models available for inference provider and fallback configuration, including
    product usage and effective routes. A model's capabilities describe intrinsic
    behavior; product usage classes describe the requirements of operations that
    request it. This includes persisted references that
    are no longer present in the catalog.
    """
    models: [InferenceModel!]!
    """
    The model classes available to product operations.
    """
    modelClasses: [InferenceModelClassDefinition!]!
    """
    The fallback policy for models without a configured route.
    """
    routing: InferenceRoutingConfiguration!
}

"""
A paginated connection of configured inference providers.
"""
type InferenceProviderConnection implements Connection {
    """
    The configured inference providers.
    """
    nodes: [InferenceProvider!]!
    """
    The total number of configured inference providers.
    """
    totalCount: Int!
    """
    Pagination information.
    """
    pageInfo: ConnectionPageInfo!
}

extend type Mutation {
    """
    Creates an inference provider.
    """
    createInferenceProvider(input: InferenceProviderInput!): InferenceProvider!
    """
    Updates an inference provider.
    """
    updateInferenceProvider(id: ID!, input: InferenceProviderInput!): InferenceProvider!
    """
    Deletes an inference provider.
    """
    deleteInferenceProvider(id: ID!): EmptyResponse!
    """
    Validates an inference provider's configuration and model routes.
    """
    validateInferenceProvider(existingProviderID: ID, input: InferenceProviderInput!): EmptyResponse!
    """
    Updates the inference routing fallback policy.
    """
    updateInferenceRoutingConfiguration(input: InferenceRoutingConfigurationInput!): InferenceRoutingConfiguration!
}

"""
The behavior applied when no provider route matches a model.
"""
enum InferenceFallbackMode {
    BLOCK
    SOURCEGRAPH
    MODEL_CLASS
}

"""
A class of model requirements declared by product inference operations.
"""
enum InferenceModelClass {
    MINIMAL
    LOW
    MEDIUM
    HIGH
    MAX
    TRANSCRIPTION
}

"""
An inference provider implementation.
"""
enum InferenceProviderKind {
    ANTHROPIC
    ANTHROPIC_COMPATIBLE
    OPENAI
    OPENAI_COMPATIBLE
    GOOGLE
}

"""
An authentication method accepted when configuring an inference provider.
"""
enum InferenceProviderAuthenticationKind {
    API_KEY
    BEARER
    CUSTOM_HEADERS
    AWS
    AZURE_IDENTITY
    GOOGLE_SERVICE_ACCOUNT
    GOOGLE_ADC
}

"""
A provider API dialect used to encode an inference request.
"""
enum InferenceProtocol {
    ANTHROPIC_MESSAGES
    GOOGLE
    OPENAI_CHAT
    OPENAI_RESPONSES
    OPENAI_AUDIO_TRANSCRIPTIONS
}

"""
The availability state of a catalog model.
"""
enum InferenceModelLifecycle {
    ACTIVE
    UPCOMING
    RETIRED
}

"""
Inference behavior supported or required by a model.
"""
enum InferenceModelCapability {
    IMAGE_INPUT
    TOOL_CALLING
    REASONING
}

"""
How a model relates to current product usage and the model catalog.
"""
enum InferenceModelStatus {
    ACTIVE
    UNUSED
    UNKNOWN
}

"""
The configuration responsible for an effective model route.
"""
enum InferenceRouteSource {
    EXACT
    POLICY
    SOURCEGRAPH
    MODEL_CLASS
    BLOCKED
}

"""
The reasoning expenditure requested by a product operation.
"""
enum InferenceReasoningEffort {
    NONE
    MINIMAL
    LOW
    MEDIUM
    HIGH
    XHIGH
}

"""
How a product operation requests that reasoning output be returned.
"""
enum InferenceThinkingDisplay {
    SUMMARIZED
    OMITTED
}

"""
The fallback policy for models without a configured route.
"""
type InferenceRoutingConfiguration {
    """
    The behavior to apply when no provider route matches a model.
    """
    fallbackMode: InferenceFallbackMode!
    """
    The replacement model configured for each model class.
    """
    fallbackModels: [InferenceFallbackModel!]!
}

"""
A replacement model configured for a model class.
"""
type InferenceFallbackModel {
    """
    The model class to replace.
    """
    modelClass: InferenceModelClass!
    """
    The canonical reference of the replacement model.
    """
    modelRef: String!
    """
    When this replacement model was last reviewed.
    """
    lastReviewedAt: DateTime!
}

"""
Input for updating the inference routing fallback policy.
"""
input InferenceRoutingConfigurationInput {
    """
    The behavior to apply when no provider route matches a model.
    """
    fallbackMode: InferenceFallbackMode!
    """
    The replacement models to configure by model class.
    """
    fallbackModels: [InferenceFallbackModelInput!]!
}

"""
Input for a replacement model configured for a model class.
"""
input InferenceFallbackModelInput {
    """
    The model class to replace.
    """
    modelClass: InferenceModelClass!
    """
    The canonical reference of the replacement model.
    """
    modelRef: String!
}

"""
A configured inference provider.
"""
interface InferenceProvider implements Node {
    """
    The provider's unique identifier.
    """
    id: ID!
    """
    The provider's display name.
    """
    name: String!
    """
    The provider's API base URL, following the vendor SDK convention:
    the origin for Anthropic APIs (https://api.anthropic.com) and the
    versioned base for OpenAI APIs (https://api.openai.com/v1). Request paths
    such as /v1/messages or /chat/completions are appended per protocol.
    """
    endpoint: String!
    """
    The provider's authentication configuration.
    """
    authentication: InferenceProviderAuthentication!
    """
    Model routes configured explicitly on this provider.
    """
    explicitModelRoutes: [InferenceProviderExplicitModelRoute!]!
    """
    Whether this provider automatically covers compatible models from its publisher.
    """
    automaticCoverage: Boolean!
    """
    Canonical model references excluded from automatic coverage.
    """
    excludedModelRefs: [String!]!
}

"""
A provider using Anthropic's hosted API.
"""
type AnthropicInferenceProvider implements Node & InferenceProvider {
    """
    The provider's unique identifier.
    """
    id: ID!
    """
    The provider's display name.
    """
    name: String!
    """
    The provider's API base URL, following the vendor SDK convention:
    the origin for Anthropic APIs (https://api.anthropic.com) and the
    versioned base for OpenAI APIs (https://api.openai.com/v1). Request paths
    such as /v1/messages or /chat/completions are appended per protocol.
    """
    endpoint: String!
    """
    The provider's authentication configuration.
    """
    authentication: InferenceProviderAuthentication!
    """
    Model routes configured explicitly on this provider.
    """
    explicitModelRoutes: [InferenceProviderExplicitModelRoute!]!
    """
    Whether this provider automatically covers compatible models from its publisher.
    """
    automaticCoverage: Boolean!
    """
    Canonical model references excluded from automatic coverage.
    """
    excludedModelRefs: [String!]!
}

