    The change request was closed without being merged.
    """
    CLOSED
    """
    The change request was merged.
    """
    MERGED
    """
    The code host reported a state that Sourcegraph does not recognize.
    """
    UNKNOWN
}

extend type Mutation {
    """
    EXPERIMENTAL: Updates a changeset's description as the viewer's linked
    code-host account. Checks the live description against expectedBody before
    writing. The code host enforces permissions. Conflict detection is best
    effort: a concurrent edit on the host between the check and write can be overwritten.
    """
    updateChangeRequestDescription(input: UpdateChangeRequestDescriptionInput!): ChangeRequest!
    """
    EXPERIMENTAL: Merges one changeset as the viewer's linked code-host account.
    Rechecks readiness and atomically requires the displayed head to match.
    Requires the same access as changeRequest. Does not bypass code-host rules.
    """
    mergeChangeRequest(input: MergeChangeRequestInput!): ChangeRequest!
    """
    EXPERIMENTAL: Marks one draft changeset ready for review as the viewer's
    linked code-host account. Succeeds without a change if it is already ready
    for review. Requires the same access as changeRequest; the code host
    enforces permissions. Currently supports GitHub.
    """
    markChangeRequestReadyForReview(input: MarkChangeRequestReadyForReviewInput!): ChangeRequest!
    """
    EXPERIMENTAL: Moves one file to a review category for all viewers. Only
    the author may edit; the synchronized base and head must still match.
    """
    moveChangeRequestFile(input: MoveChangeRequestFileInput!): ChangeRequestFileGrouping!
    """
    EXPERIMENTAL: Reports whether the viewer is looking at, reviewing, and
    typing a chat message about a change request in one browser session, and
    returns the users looking at it or who looked at it in the last 4 hours:
    the viewer first, then those looking at it, and the rest most recent first.
    Clients report active about every 15 seconds while the page is visible, or
    every 5 seconds while others are looking at it, and inactive when it is
    hidden or closed. A session stops counting 45 seconds after its last active
    report.
    """
    reportChangeRequestPresence(input: ReportChangeRequestPresenceInput!): [ChangeRequestViewer!]!
    """
    EXPERIMENTAL: Requests a review report of the change request's current
    synchronized head, shaped by the viewer's prompt. Generation is
    asynchronous: the report starts QUEUED, and its document fills in as the
    agent works. Poll changeRequestReport for progress.
    """
    createChangeRequestReport(input: CreateChangeRequestReportInput!): ChangeRequestReport!
    """
    EXPERIMENTAL: Sends a message to the change request's chat as the viewer.
    The message is stored only in Sourcegraph, not posted to the code host.
    """
    sendChangeRequestChatMessage(input: SendChangeRequestChatMessageInput!): ChangeRequestChatMessage!
    """
    EXPERIMENTAL: Deletes one of the viewer's own chat messages.
    """
    deleteChangeRequestChatMessage(input: DeleteChangeRequestChatMessageInput!): EmptyResponse!
    """
    EXPERIMENTAL: Replaces the text of one of the viewer's own chat messages,
    which is possible for 30 minutes after sending it. Mentions added by
    editing don't notify anyone.
    """
    editChangeRequestChatMessage(input: EditChangeRequestChatMessageInput!): ChangeRequestChatMessage!
    """
    EXPERIMENTAL: Submits a review for a code-host change request. The initial
    implementation supports GitHub pull requests only.
    """
    submitChangeRequestReview(input: SubmitChangeRequestReviewInput!): SubmitChangeRequestReviewPayload!
    """
    EXPERIMENTAL: Starts a thread of inline comments on a change request's
    diff as the viewer's linked code-host account. The comment is posted
    immediately. Currently supports GitHub.
    """
    addChangeRequestReviewThread(input: AddChangeRequestReviewThreadInput!): ChangeRequestReviewCommentPayload!
    """
    EXPERIMENTAL: Replies to a thread of inline comments as the viewer's linked
    code-host account. Currently supports GitHub.
    """
    replyToChangeRequestReviewThread(input: ReplyToChangeRequestReviewThreadInput!): ChangeRequestReviewCommentPayload!
    """
    EXPERIMENTAL: Deletes a comment of a change request review thread as the
    viewer's linked code-host account, if the code host allows it. Currently
    supports GitHub.
    """
    deleteChangeRequestReviewComment(
        input: DeleteChangeRequestReviewCommentInput!
    ): DeleteChangeRequestReviewCommentPayload!
    """
    EXPERIMENTAL: Connects Semgrep to show security scan results on
    changesets, replacing any existing connection. Requires the
    INTEGRATION_MANAGEMENT#WRITE permission and the bacon feature flag.
    """
    connectReviewSemgrep(input: ConnectReviewSemgrepInput!): ReviewSemgrepConnection!
    """
    EXPERIMENTAL: Disconnects Semgrep. Sourcegraph stops requesting scan
    results; results already shown on changesets remain. Requires the
    INTEGRATION_MANAGEMENT#WRITE permission and the bacon feature flag.
    """
    disconnectReviewSemgrep: EmptyResponse!
    """
    EXPERIMENTAL: Creates a rule that turns references in changeset
    descriptions into links. Requires the INTEGRATION_MANAGEMENT#WRITE
    permission and the bacon feature flag.
    """
    createReviewDescriptionLinkRule(input: CreateReviewDescriptionLinkRuleInput!): ReviewDescriptionLinkRule!
    """
    EXPERIMENTAL: Deletes a description link rule. Requires the
    INTEGRATION_MANAGEMENT#WRITE permission and the bacon feature flag.
    """
    deleteReviewDescriptionLinkRule(id: ID!): EmptyResponse!

    """
    EXPERIMENTAL: Sends a direct message with a link to link the viewer's Slack
    account. The Sourcegraph Slack app sends it to the account in a connected
    Slack workspace whose email address is a verified email address of the
    viewer. Opening the link signed in as the viewer and passing its token to
    linkReviewSlackAccount links the account. The link expires after 15
    minutes. Requires a signed-in user and the bacon feature flag.
    """
    requestReviewSlackAccountLink: EmptyResponse!

    """
    EXPERIMENTAL: Links the Slack account that received the token from
    requestReviewSlackAccountLink to the viewer, replacing the viewer's
    previously linked account. Only the viewer who requested the token can use
    it. The Sourcegraph Slack app then sends the account a direct message when
    a changeset requests a review from the viewer's linked code-host account.
    Requires a signed-in user and the bacon feature flag.
    """
    linkReviewSlackAccount(token: String!): ReviewSlackAccount!

    """
    EXPERIMENTAL: Unlinks the viewer's Slack account, if they linked one.
    Requires a signed-in user and the bacon feature flag.
    """
    unlinkReviewSlackAccount: EmptyResponse!
}

"""
Code-host actions available to the viewer for a specific changeset.
"""
