"""
How much investigation a report's agent may do. More effort takes longer and
reads more context.
"""
enum ChangeRequestReportEffort {
    """
    Reads only the diff. Fastest.
    """
    QUICK
    """
    Reads the diff and surrounding files.
    """
    STANDARD
    """
    Investigates further, with a larger budget.
    """
    DEEP
}

"""
The lifecycle of a review report.
"""
enum ChangeRequestReportState {
    """
    Waiting for a worker.
    """
    QUEUED
    """
    The agent is working; the document may be partially filled in.
    """
    PROCESSING
    """
    Generation ended with a document. See partial.
    """
    COMPLETED
    """
    Generation ended without a usable document. See failureMessage.
    """
    FAILED
}

"""
EXPERIMENTAL: A review report: a structured document an agent wrote about one
revision of a change request, following a viewer's prompt.
"""
type ChangeRequestReport {
    """
    The unique ID of the report.
    """
    id: ID!
    """
    The prompt the report was requested with.
    """
    prompt: String!
    """
    The effort the report was requested with.
    """
    effort: ChangeRequestReportEffort!
    """
    Generation state.
    """
    state: ChangeRequestReportState!
    """
    Whether a COMPLETED report ended before the agent finished, for example
    because it used up its budget. The document contains what it produced.
    """
    partial: Boolean!
    """
    Why generation failed, or null unless FAILED.
    """
    failureMessage: String
    """
    The merge base the report compares against, or null before generation
    resolved it. Lines on the base side of the document refer to this revision.
    """
    diffBaseOID: GitObjectID
    """
    The change request head the report describes. Lines on the head side of the
    document refer to this revision.
    """
    headOID: GitObjectID!
    """
    The report document as JSON, or null until the agent has produced an
    outline. Its format is versioned by its version field; see the client's
    report spec for the shape. Updated while PROCESSING.
    """
    document: JSONValue
    """
    The user who requested the report, or null if they were deleted.
    """
    creator: User
    """
    When the report was requested.
    """
    createdAt: DateTime!
    """
    When the report or its document last changed.
    """
    updatedAt: DateTime!
}

"""
An author-requested category change for one file in a synchronized revision.
"""
input MoveChangeRequestFileInput {
    """
    The changeset to edit.
    """
    changeRequest: ID!
    """
    The synchronized base commit shown to the author (not the merge base).
    """
    expectedBaseOID: GitObjectID!
    """
    The synchronized head commit shown to the author.
    """
    expectedHeadOID: GitObjectID!
    """
    The changed file path.
    """
    path: String!
    """
    The destination category.
    """
    category: ChangeRequestFileCategory!
}

"""
Input for submitting a review for a code-host change request.
"""
input SubmitChangeRequestReviewInput {
    """
    The repository containing the change request.
    """
    repository: ID!
    """
    The change request's stable identifier within its repository.
    """
    externalID: String!
    """
    The change request head commit that was reviewed.
    """
    expectedHeadOID: GitObjectID!
    """
    The review action to submit.
    """
    action: ChangeRequestReviewAction!
    """
    An optional review comment. A non-empty body is required for COMMENT and
    REQUEST_CHANGES actions.
    """
    body: String
    """
    Threads of inline comments to start with the review. Their lines refer to
    the diff of expectedHeadOID. The code host posts the review and its
    threads together, or none of them.
    """
    threads: [ChangeRequestReviewDraftThread!]
}

"""
A thread of inline comments that is started as part of a review.
"""
input ChangeRequestReviewDraftThread {
    """
    The path of the commented file in the diff.
    """
    path: String!
    """
    The side containing the first line.
    """
    startSide: DiffAnchorSide!
    """
    The first line, inclusive, in the file on startSide.
    """
    startLine: Int!
    """
    The side containing the last line.
    """
    endSide: DiffAnchorSide!
    """
    The last line, inclusive, in the file on endSide.
    """
    endLine: Int!
    """
    The comment as code-host markup.
    """
    body: String!
}

"""
Input for starting a change request review thread.
"""
input AddChangeRequestReviewThreadInput {
    """
    The change request to comment on.
    """
    changeRequest: ID!
    """
    The head commit of the diff the lines refer to. It must be the change
    request's current head on the code host.
    """
    expectedHeadOID: GitObjectID!
    """
    The path of the commented file in the diff.
    """
    path: String!
    """
    The side containing the first line.
    """
    startSide: DiffAnchorSide!
    """
    The first line, inclusive, in the file on startSide.
    """
    startLine: Int!
    """
    The side containing the last line.
    """
    endSide: DiffAnchorSide!
    """
    The last line, inclusive, in the file on endSide.
    """
    endLine: Int!
    """
    The comment as code-host markup.
    """
    body: String!
}

"""
Input for replying to a change request review thread.
"""
input ReplyToChangeRequestReviewThreadInput {
    """
    The thread to reply to.
    """
    thread: ID!
    """
    The comment as code-host markup.
    """
    body: String!
}

"""
Input for deleting a change request review comment.
"""
input DeleteChangeRequestReviewCommentInput {
    """
    The comment to delete.
    """
    comment: ID!
}

"""
The result of deleting a change request review comment.
"""
type DeleteChangeRequestReviewCommentPayload {
    """
    The outcome of deleting the comment. Deleting a comment that no longer
    exists succeeds. The comment disappears from the change request's
    reviewThreads after the next synchronization.
    """
    status: SubmitChangeRequestReviewStatus!
}

"""
The result of posting a change request review comment.
"""
type ChangeRequestReviewCommentPayload {
    """
    The outcome of posting the comment.
    """
    status: SubmitChangeRequestReviewStatus!
    """
    The latest head commit when status is HEAD_CHANGED.
    """
    currentHeadOID: GitObjectID
    """
    The ID of the thread containing the comment when status is SUCCESS.
    """
    threadID: ID
    """
    The posted comment when status is SUCCESS. It appears in the change
    request's reviewThreads after the next synchronization.
    """
    comment: ChangeRequestReviewComment
}

"""
An action that can be submitted as part of a change-request review.
"""
enum ChangeRequestReviewAction {
    COMMENT
    APPROVE
    REQUEST_CHANGES
}

"""
The result of submitting a change-request review.
"""
type SubmitChangeRequestReviewPayload {
    """
    The outcome of the review submission.
    """
    status: SubmitChangeRequestReviewStatus!
    """
    The latest head commit when status is HEAD_CHANGED.
    """
    currentHeadOID: GitObjectID
    """
    The reviewed change request when status is SUCCESS, with the submitted
    approval or change request and the code host's resulting review status
    already reflected, ahead of the next synchronization. Null otherwise, or if
    the change request isn't synchronized.
    """
    changeRequest: ChangeRequest
}

"""
The outcome of submitting a change-request review.
"""
enum SubmitChangeRequestReviewStatus {
    SUCCESS
    UNSUPPORTED
    NOT_FOUND
    CREDENTIAL_REQUIRED
    PERMISSION_DENIED
    HEAD_CHANGED
    INVALID_STATE
}
