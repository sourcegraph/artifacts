extend type Query {
    """
    EXPERIMENTAL: Lists synchronized code-host change requests, newest first
    by creation time on the code host. Only signed-in users can list change
    requests, and only while the bacon feature flag is enabled. The viewer only
    sees change requests of repositories they can access on Sourcegraph; site
    administrators also see those of repositories that aren't on Sourcegraph.
    """
    changeRequests(
        """
        Filters applied before pagination. Omit to list all change requests.
        """
        filter: ChangeRequestFilter
        """
        Search text. Matches change requests whose number (such as "#123"),
        title, description, repository name, author login or head branch
        contain each whitespace-separated word as a literal, case-insensitive
        substring, in any order. Must contain a word of at least 3 characters.
        Empty or omitted means unrestricted.
        Changes are searchable a few seconds after they are synchronized, and
        only the beginning of long descriptions is searched.
        """
        query: String
        """
        Returns the first n change requests. Must be between 1 and 100, and
        cannot be combined with last or before. Defaults to 50 when neither
        first nor last is set.
        """
        first: Int
        """
        Opaque cursor from pageInfo.endCursor. Returns change requests after it.
        """
        after: String
        """
        Returns the last n change requests. Must be between 1 and 100, and
        cannot be combined with first or after.
        """
        last: Int
        """
        Opaque cursor from pageInfo.startCursor. Returns change requests before it.
        """
        before: String
        """
        Whether to return only one change request per stack: the newest member
        that matches the filter. Change requests outside of stacks are
        unaffected. Use stack.changeRequests to list all members. Omit or pass
        null for false.
        """
        collapseStacks: Boolean
    ): ChangeRequestConnection!

    """
    EXPERIMENTAL: Looks up a synchronized code-host change request by ID. Returns
    null if it does not exist or the viewer can't access its repository (see
    changeRequests). Only signed-in users can look up change requests, and only
    while the bacon feature flag is enabled.
    """
    changeRequest(id: ID!): ChangeRequest

    """
    EXPERIMENTAL: Code-host capabilities for a changeset and the viewer's linked
    account. Requires the same access as changeRequest. Capabilities are scoped
    to this changeset, not global properties of the code host.
    """
    codeHostCapabilities(changeRequest: ID!): CodeHostCapabilities!

    """
    EXPERIMENTAL: Looks up a review report by ID. Any viewer who can look up
    change requests and access the report's repository can open a report by ID,
    not only its creator. Returns null if it does not exist or the repository
    is not available to the viewer.
    """
    changeRequestReport(id: ID!): ChangeRequestReport

    """
    EXPERIMENTAL: Looks up a synchronized code-host change request by repository
    and number. Returns null if it does not exist or the viewer can't access its
    repository (see changeRequests). Only signed-in users can look up change
    requests, and only while the bacon feature flag is enabled.
    """
    changeRequestByRepository(
        """
        Code-host-qualified repository name, such as github.com/owner/name.
        Does not require the repository to be indexed by Sourcegraph.
        """
        repository: String!
        """
        The positive change request number on the code host, such as 123.
        """
        number: Int!
    ): ChangeRequest

    """
    EXPERIMENTAL: Searches the code-host teams that change requests requested a
    review from, ordered by organization and slug. The viewer only sees the teams
    of organizations with a change request visible to them (see
    changeRequests), including teams without current review requests. Only
    signed-in users can search teams, and only while the bacon feature flag is
    enabled.
    """
    changeRequestTeams(
        """
        Matches teams whose organization and slug, written as
        organization/slug, contain the text, ignoring case. Empty matches all
        teams.
        """
        query: String!
        """
        Whether to return only the teams that the viewer is a member of, as
        for team review requests in ChangeRequestFilter.requestedReviewers.
        Omit or pass null for false.
        """
        viewerIsMember: Boolean
        """
        Returns the first n teams. Must be between 1 and 100.
        """
        first: Int!
    ): [CodeHostTeam!]!

    """
    EXPERIMENTAL: Looks up a code-host team that change requests requested a
    review from, by its organization and slug, ignoring case. Returns null if
    there is no such team or the viewer can't see it (see changeRequestTeams).
    Names are refreshed when a change request that requests the team is
    synchronized, so if a renamed team's previous name was taken by another
    team, returns the most recently added one. Only signed-in users can look up
    teams, and only while the bacon feature flag is enabled.
    """
    changeRequestTeam(
        """
        The code host's base URL, ignoring a trailing slash.
        """
        codeHostURL: String!
        """
        The login of the team's organization on the code host.
        """
        organization: String!
        """
        The team's slug.
        """
        slug: String!
    ): CodeHostTeam

    """
    EXPERIMENTAL: The Semgrep connection that provides security scan results
    for changesets, or null if Semgrep is not connected. Requires the
    INTEGRATION_MANAGEMENT#READ permission and the bacon feature flag.
    """
    reviewSemgrepConnection: ReviewSemgrepConnection

    """
    EXPERIMENTAL: The rules that turn references in changeset descriptions,
    such as issue keys, into links, ordered by key prefix. Requires a signed-in
    user and the bacon feature flag.
    """
    reviewDescriptionLinkRules: [ReviewDescriptionLinkRule!]!

    """
    EXPERIMENTAL: The Slack account that the viewer linked to get notified
    about review requests, or null if they haven't linked one. Requires a
    signed-in user and the bacon feature flag.
    """
    reviewSlackAccount: ReviewSlackAccount
}

"""
Filters for synchronized change requests. All supplied filters and all
comparator fields within a filter are combined. Omitted filters and
comparator fields are unrestricted.
"""
input ChangeRequestFilter {
    """
    The change request's state.
    """
    state: ChangeRequestStateComparator
    """
    Whether the change request is a draft.
    """
    draft: ChangeRequestBooleanComparator
    """
    The author. A Sourcegraph user matches linked code-host accounts or verified
    emails in the stored payload. A code-host account matches its login on that
    code host. Currently supports GitHub, so nin matches all change requests on
    other code hosts.
    """
    author: ChangeRequestParticipantComparator
    """
    The reviewers from whom a review is currently requested. Does not imply a
    state or draft filter.

    A Sourcegraph user includes direct and team requests, unless via restricts
    them to one of the two. Direct requests match a linked code-host account or
    verified email in the stored payload. Team requests require a linked GitHub
    account and app-synchronized membership from the last 30 minutes, so none
    still matches team requests whose membership is stale. Membership is
    refreshed periodically using Review GitHub App installations with
    Organization members: read permission.

    A code-host account matches only direct requests for its login on that code
    host. A team matches only requests of the team itself, regardless of its
    membership. Currently supports GitHub.
    """
    requestedReviewers: ChangeRequestParticipantCollectionComparator
    """
    The repository name on the code host, such as owner/name.
    """
    repository: ChangeRequestStringComparator
    """
    Whether the repository is archived on the code host. Omit to include
    change requests of both archived and active repositories.
    """
    repositoryArchived: ChangeRequestBooleanComparator
    """
    The code-host base URL. Equality ignores a trailing slash.
    """
    codeHostURL: ChangeRequestStringComparator
    """
    When the change request was created on the code host.
    """
    createdAt: ChangeRequestDateComparator
    """
    When the change request was last updated on the code host.
    """
    updatedAt: ChangeRequestDateComparator
    """
    When the change request was merged. Excludes change requests that were not
    merged.
    """
    mergedAt: ChangeRequestDateComparator
    """
    When the change request was closed on the code host. Excludes change
    requests that were not closed. Code hosts such as GitHub also report a close
    time for merged change requests.
    """
    closedAt: ChangeRequestDateComparator
    """
    The change request's ID, such as to exclude change requests that a user
    dismissed.
    """
    id: ChangeRequestIDComparator
}

"""
Compares a change request's ID. Lists contain at most 500 IDs.
"""
input ChangeRequestIDComparator {
    """
    Is none of the given change requests.
    """
    nin: [ID!]
}

"""
Compares a change request's state.
"""
input ChangeRequestStateComparator {
    """
    Equals the given state.
    """
    eq: ChangeRequestState
    """
    Does not equal the given state.
    """
    neq: ChangeRequestState
    """
    Is any of the given states. An empty list is unrestricted.
    """
    in: [ChangeRequestState!]
    """
    Is none of the given states.
    """
    nin: [ChangeRequestState!]
}

"""
Compares a boolean. Set at most one field.
"""
input ChangeRequestBooleanComparator {
    """
    Equals the given value.
    """
    eq: Boolean
    """
    Does not equal the given value.
    """
    neq: Boolean
}

"""
Compares a date. Together, gte and lt select a half-open range.
"""
input ChangeRequestDateComparator {
    """
    Is at or after the given time.
    """
    gte: DateTime
    """
    Is before the given time.
    """
    lt: DateTime
}

"""
Compares a string, ignoring case. Empty values are unrestricted.
"""
input ChangeRequestStringComparator {
    """
    Equals the given value.
    """
    eq: String
    """
    Does not equal the given value.
    """
    neq: String
    """
    Contains the given value as a literal substring.
    """
    contains: String
    """
    Does not contain the given value as a literal substring.
    """
    notContains: String
}

"""
Compares a single change request participant. Lists contain at most 20
participants.
"""
input ChangeRequestParticipantComparator {
    """
    Is any of the given participants. An empty list is unrestricted.
    """
    in: [ChangeRequestParticipantInput!]
    """
    Is none of the given participants.
    """
    nin: [ChangeRequestParticipantInput!]
}

"""
Compares a list of change request participants. Lists contain at most 20
participants.
"""
input ChangeRequestParticipantCollectionComparator {
    """
    Any of the given participants is in the list. An empty list is unrestricted.
    """
    some: [ChangeRequestParticipantInput!]
    """
    None of the given participants is in the list.
    """
    none: [ChangeRequestParticipantInput!]
}

"""
A change request participant used in filters. Set exactly one of user,
codeHostAccount and team. A Sourcegraph user without linked accounts or
verified emails matches nothing for in and some, and excludes nothing for nin
and none.
"""
input ChangeRequestParticipantInput {
    """
    The ID of a Sourcegraph user.
    """
    user: ID
    """
    How the user's review must have been requested. Only supported together
    with user in requestedReviewers. Omit to match both direct and team
    requests.
    """
    via: ChangeRequestReviewRequestSource
    """
    A code-host account, which does not need to be linked to a Sourcegraph user.
    """
    codeHostAccount: ChangeRequestCodeHostAccountInput
    """
    The ID of a code-host team, as returned by CodeHostTeam.id. Only supported
    in requestedReviewers.
    """
    team: ID
}

"""
How a review was requested from a user.
"""
enum ChangeRequestReviewRequestSource {
    """
    The review was requested from the user directly.
    """
    DIRECT
    """
    The review was requested from a team that the user is a member of.
    """
    TEAM
}

"""
EXPERIMENTAL: A team on a code host from which a change request requests a
review. Its organization and slug are as of the latest synchronization
of a change request that requests a review from it.
"""
type CodeHostTeam {
    """
    The unique ID of the team. It stays the same when the team or its
    organization is renamed, so filters can keep using it.
    """
    id: ID!
    """
    The base URL of the team's code host.
    """
    codeHostURL: String!
    """
    The login of the team's organization on the code host.
    """
    organization: String!
    """
    The team's slug, which identifies it within its organization in mentions
    and URLs.
    """
    slug: String!
    """
    The URL of the team on the code host.
    """
    url: String!
}

"""
An account on a code host, identified by its login.
"""
input ChangeRequestCodeHostAccountInput {
    """
    The code host's base URL, ignoring a trailing slash.
    """
    codeHostURL: String!
    """
    The account's case-insensitive login on the code host, as stored when the
    change request was last synchronized.
    """
    login: String!
}

"""
A page of change requests. Nodes are always newest first, whether paging
forward or backward.
"""
type ChangeRequestConnection {
    """
    The change requests in this page.
    """
    nodes: [ChangeRequest!]!
    """
    Pagination information.
    """
    pageInfo: ConnectionPageInfo!
}

"""
A change request, such as a GitHub pull request, synchronized from a code host.
It may belong to a repository that is not in Sourcegraph's repository catalog.
"""
type ChangeRequest {
    """
    The unique ID of the change request.
    """
    id: ID!
    """
    The kind of code host on which the change request exists.
    """
    codeHost: ExternalServiceKind!
    """
    The base URL of the code host on which the change request exists.
    """
    codeHostURL: String!
    """
    The code host's identifier for the change request's repository.
    """
    externalRepositoryID: String!
    """
    The name of the change request's repository on the code host, such as
    owner/name.
    """
    repositoryName: String!
    """
    Whether the change request's repository is archived, or otherwise
    read-only, on the code host. Always false on code hosts without archived
    repositories.
    """
    repositoryArchived: Boolean!
    """
    The Sourcegraph repository mirroring the change request's repository, or
    null if it is not synchronized to Sourcegraph or the viewer cannot access it.
    Use repository.comparison(base: baseOID, head: headOID) to load its diff.
    Currently supports GitHub.
    """
    repository: Repository
    """
    The change request's number within its repository, such as a pull request
    number.
    """
    externalID: String!
    """
    The change request's URL on the code host.
    """
    url: String!
    """
    The change request's title.
    """
    title: String!
    """
    The change request's description as raw, unsanitized code-host markup.
    Clients must sanitize it before rendering it as HTML.
    """
    body: String!
    """
    The change request's state.
    """
    state: ChangeRequestState!
    """
    Whether the change request is a draft.
    """
    draft: Boolean!
    """
    The code-host user who opened the change request.
    """
    author: Person!
    """
    The code-host users assigned to the change request.
    """
    assignees: [Person!]!
    """
    The code-host users from whom a review is currently requested.
    """
    requestedReviewers: [Person!]!
    """
    The slugs of the code-host teams whose review is currently requested.
    """
    requestedTeams: [String!]! @deprecated(reason: "Use requestedReviewerTeams, which identifies teams by ID.")
    """
    The code-host teams from which a review is currently requested, ordered by
    organization and slug.
    """
    requestedReviewerTeams: [CodeHostTeam!]!
    """
    The change request's labels.
    """
    labels: [String!]!
    """
    The name of the branch containing the changes.
    """
    headRef: String!
    """
    The name of the branch into which the changes would be merged.
    """
    baseRef: String!
    """
    The current head commit of the change request.
    """
    headOID: GitObjectID!
    """
    The base commit of the change request when it was last synchronized.
    """
    baseOID: GitObjectID!
    """
    When the change request was created on the code host.
    """
    createdAt: DateTime!
    """
    When the change request was last updated on the code host.
    """
    updatedAt: DateTime!
    """
    When Sourcegraph last synchronized the change request.
    """
    syncedAt: DateTime!
    """
    When the change request was closed on the code host, or null if it was not
    closed.
    """
    closedAt: DateTime
    """
    When the change request was merged, or null if it was not merged.
    """
    mergedAt: DateTime
    """
    The code host's diff statistics as of the last synchronization, or null if
    the code host did not report them. Currently supports GitHub.
    """
    diffStat: ChangeRequestDiffStat
    """
    File review priorities for the current synchronized revision. Read-only:
    querying this field never schedules analysis. Null if no job exists or
    the repository is not available to the viewer.
    """
    fileGrouping: ChangeRequestFileGrouping
    """
    Signals computed for the current synchronized head, such as security scan
    results. Read-only: querying this field never schedules analysis. Empty if
    none were computed or the repository is not available to the viewer.
    """
    signals: [ChangeRequestSignal!]!
    """
    Code-host CI for the current synchronized head. Read-only: this field
    never contacts the code host or schedules work. Currently supports GitHub.
    """
    ci: ChangeRequestCI!
    """
    Whether the viewer is the author of this change request.
    """
    viewerIsAuthor: Boolean!
    """
    The stack containing the change request, or null if it is not part of a
    stack. Currently supports GitHub stacked pull requests.
    """
    stack: ChangeRequestStack
    """
    The code host's overall review status as of the last synchronization, or
    null if the code host reports none, such as a GitHub pull request without
    approving or change-requesting reviews whose base branch does not require
    reviews. Currently supports GitHub.
    """
    reviewStatus: ChangeRequestReviewStatus
    """
    The latest review of each reviewer who approved or requested changes, as of
    the last synchronization, including reviewers whose review does not count
    toward the review status. Excludes comment-only and dismissed reviews.
    Currently supports GitHub, up to 100 reviewers.
    """
    reviews: [ChangeRequestReview!]!
    """
    EXPERIMENTAL: The viewer's review reports for this change request, for any
    head, newest first. At most 50. Empty if the repository is not available to
    the viewer.
    """
    viewerReports: [ChangeRequestReport!]!
    """
    EXPERIMENTAL: The viewer's Deep Search conversations about this change
    request, most recently updated first. At most 50.
    """
    viewerDeepSearchConversations: [ChangeRequestDeepSearchConversation!]!
    """
    Compatibility read for the existing inline-comment UI, ordered by path and
    line. Includes outdated file/line threads, with path-level permission checks.
    New discussion consumers should use reviewThreads.
    """
    inlineReviewThreads: [ChangeRequestReviewThread!]!
        @deprecated(reason: "Use the paginated reviewThreads connection for all discussions.")
    """
    All published discussion threads as of the last synchronization, regardless
    of code-host comment type or whether they have a current code location.
    Display every thread in Discussion; also display it inline when anchor is
    present and matches the displayed diff. originalContext is historical code,
    never a current anchor. Ordered oldest first in both pagination directions.
    Unavailable with sub-repository permissions because general discussions
    cannot be filtered by path. GitHub is the first synchronization adapter.
    """
    reviewThreads(
        """
        Return the first n threads (1–100). Cannot be combined with last.
        """
        first: Int
        """
        Return threads after this cursor.
        """
        after: String
        """
        Return the last n threads (1–100). Cannot be combined with first.
        """
        last: Int
        """
        Return threads before this cursor.
        """
        before: String
    ): ChangeRequestReviewThreadConnection!
    """
    EXPERIMENTAL: Messages in the change request's chat. Chat messages are
    stored only in Sourcegraph, not posted to the code host. Empty if the
    repository is not available to the viewer.
    """
    chatMessages(
        """
        Returns the first n messages. Must be between 1 and 100, and cannot be
        combined with last.
        """
        first: Int
        """
        Opaque cursor from pageInfo.endCursor. Returns messages after it.
        """
        after: String
        """
        Returns the last n messages, such as the most recent ones. Must be
        between 1 and 100, and cannot be combined with first.
        """
        last: Int
        """
        Opaque cursor from pageInfo.startCursor. Returns messages before it.
        """
        before: String
    ): ChangeRequestChatMessageConnection!
}

"""
EXPERIMENTAL: A Deep Search conversation about a change request.
"""
type ChangeRequestDeepSearchConversation {
    """
    The token to read the conversation with.
    """
    readToken: String!
    """
    The conversation's title, or null until Deep Search names it.
    """
    title: String
    """
    The change request's head when the conversation was started.
    """
    headOID: GitObjectID!
}

"""
A page of chat messages. Nodes are always oldest first, whether paging forward
or backward.
"""
type ChangeRequestChatMessageConnection {
    """
    The messages in this page.
    """
    nodes: [ChangeRequestChatMessage!]!
    """
    Pagination information.
    """
    pageInfo: ConnectionPageInfo!
}

"""
The last observed CI results for the change request's current synchronized
head. Sourcegraph may not yet have observed newer commits or check updates.
This is not a merge-readiness decision: code hosts can require checks on a
test merge commit, reviews, or other rules.
"""
type ChangeRequestCI {
    """
    The synchronized head described by this snapshot, never results from a
    different head. This is not a live lookup of the code host's current head.
    """
    headOID: GitObjectID!
    """
    The code host's aggregate result where available, or UNKNOWN if there is
    no supported equivalent. GitHub includes check runs and commit statuses.
    NO_CHECKS means a complete fetch found no checks in the adapter's scope.
    """
    status: ChangeRequestCIStatus!
    """
    Last observed checks, not individual commands within a job. Names are not
    unique. Cached results retain their reported status as they age; syncedAt
    indicates the age of the snapshot.
    """
    checks: [ChangeRequestCICheck!]!
    """
    Whether Sourcegraph retrieved the results, distinct from whether CI passed.
    """
    syncState: ChangeRequestCISyncState!
    """
    Last successful complete fetch for this head, or null before one succeeds.
    """
    syncedAt: DateTime
    """
    A safe explanation when syncState is ERROR. Previous same-head results may
    remain available; syncedAt indicates their age.
    """
    error: String
}

"""
A named check or commit-status context reported by a code host.
"""
type ChangeRequestCICheck {
    """
    Opaque identity scoped to the change request and head. A rerun can change it.
    """
    id: ID!
    """
    The check's display name.
    """
    name: String!
    """
    The check provider, if known.
    """
    provider: String
    """
    Normalized execution state or conclusion.
    """
    status: ChangeRequestCICheckStatus!
    """
    A link to the check on the provider, if available.
    """
    detailsURL: String
    """
    Whether the base branch's rules require this check to pass before merging.
    """
    required: Boolean!
}

"""
Code-host aggregate CI state. SUCCESS follows the host's semantics, which may
accept skipped, neutral, or allowed-failure checks. It does not guarantee that
every check passed or that the change request is mergeable. UNKNOWN includes
hosts without a supported aggregate result; it is never treated as success.
"""
enum ChangeRequestCIStatus {
    NO_CHECKS
    PENDING
    SUCCESS
    FAILED
    UNKNOWN
}

"""
A check's execution state or conclusion. PENDING does not imply execution
started. BLOCKED includes manual waits and required actions. Unrecognized
provider states and GitHub's STALE conclusion are UNKNOWN, never success.
An aged cached result retains its reported status; see ChangeRequestCI.syncedAt.
"""
enum ChangeRequestCICheckStatus {
    PENDING
    QUEUED
    IN_PROGRESS
    SUCCESS
    FAILED
    CANCELED
    SKIPPED
    NEUTRAL
    BLOCKED
    UNKNOWN
}

"""
Snapshot retrieval state. READY with an empty list means no checks; ERROR
means retrieval failed, not that CI failed. UNSUPPORTED means no adapter exists.
"""
enum ChangeRequestCISyncState {
    PENDING
    READY
    ERROR
    UNSUPPORTED
}

"""
EXPERIMENTAL: A message in a change request's chat.
"""
type ChangeRequestChatMessage {
    """
    The unique ID of the message.
    """
    id: ID!
    """
    The user who sent the message, or null if they were deleted.
    """
    author: User
    """
    The message text, in Markdown. Clients must sanitize it before rendering
    it as HTML.
    """
    body: String!
    """
    The change request's head when the message was sent.
    """
    headOID: GitObjectID!
    """
    When the message was sent.
    """
    createdAt: DateTime!
    """
    When the author last edited the message, or null if they never did.
    """
    editedAt: DateTime
    """
    Whether the viewer can delete the message. Only its author can.
    """
    viewerCanDelete: Boolean!
    """
    When the viewer can no longer edit the message, or null if they can't
    edit it because they didn't send it. Its author can edit it for 30 minutes
    after sending it, so this may be in the past.
    """
    viewerCanEditUntil: DateTime
}

"""
A discussion on a change request, as reported by its code host.
"""
type ChangeRequestReviewThread {
    """
    The unique ID of the thread. It is stable across synchronizations.
    """
    id: ID!
    """
    What the discussion is about. The kinds follow GitHub's discussion model, so
    they may change or be removed when other code hosts are supported.
    """
    kind: ChangeRequestDiscussionKind!
    """
    The state of the review whose summary a REVIEW discussion is, or null for
    other kinds and states that aren't known.
    """
    reviewState: ChangeRequestDiscussionReviewState
    """
    The commit that the review of a REVIEW discussion covered, or null for other
    kinds or if it's unknown. A commit other than the change request's headOID
    means the review predates the latest changes.
    """
    reviewCommitOID: GitObjectID
    """
    The original code excerpt and location retained by the code host, or null
    when unavailable or not a line discussion. May survive a force push even
    when the original commit is no longer accessible. Not a current diff anchor.
    """
    originalContext: ChangeRequestCommentContext
    """
    The path of the commented file, or empty for a changeset-wide discussion.
    """
    path: String!
    """
    The thread's location in the diff between the change request's baseOID and
    headOID, or null if the thread is outdated or not attached to lines.
    """
    anchor: DiffAnchor
    """
    Whether the thread was resolved on the code host.
    """
    isResolved: Boolean!
    """
    Whether the commented lines changed since the thread was started.
    """
    isOutdated: Boolean!
    """
    The thread's URL on the code host.
    """
    url: String!
    """
    The thread's comments, oldest first. The first comment started the thread.
