extend type ChangedFile {
    """
    EXPERIMENTAL: Whether the viewing user has marked this file as reviewed
    in the given scope. Automatically becomes false again if the file's src or
    dst blob OID has changed since it was marked.
    """
    viewerHasViewed(
        """
        The scope the file was marked in, as passed to markChangedFilesAsViewed,
        of at most 1024 bytes. Pages whose diff revisions change while the
        review goes on, such as a changeset receiving new commits, pass a stable
        identifier of the review. Comparison pages pass "<base>...<head>", with
        "HEAD" for an omitted revision.

        Clients must pass a scope. Omitting it reads the comparison's
        "<base>...<head>" scope, which is only supported for clients loaded
        before scopes existed, and will be removed in the next release.
        """
        scope: String
    ): Boolean!
}

extend type RepositoryComparison {
    """
    EXPERIMENTAL: Threads anchored to this diff by the current user.
    This field may change or be removed without warning.
    """
    anchoredThreads: [DiffAnchoredThread!]!
}

"""
A thread associated with a location in a diff.
"""
union DiffAnchoredThread = DeepSearchDiffAnchoredThread

"""
A Deep Search conversation and the diff location that created it.
"""
type DeepSearchDiffAnchoredThread {
    """
    The identifier accepted by the Deep Search API.
    """
    conversationID: ID!
    """
    The immutable diff snapshot and selected line range.
    """
    anchor: DiffAnchor!
    """
    When the anchor mapping was created.
    """
    createdAt: DateTime!
}

"""
An immutable file and line location in a repository comparison.
"""
type DiffAnchor {
    """
    The file path on the base side, when one exists.
    """
    oldPath: String
    """
    The file path on the head side, when one exists.
    """
    newPath: String
    """
    The resolved base commit of the comparison containing the location.
    """
    baseOID: GitObjectID!
    """
    The resolved head commit of the comparison containing the location.
    """
    headOID: GitObjectID!
    """
    The base-side blob of the file in the comparison, when known.
    """
    srcOID: GitObjectID
    """
    The head-side blob of the file in the comparison, when known.
    """
    dstOID: GitObjectID
    """
    The side containing the first line.
    """
    startSide: DiffAnchorSide!
    """
    The first line, inclusive.
    """
    startLine: Int!
    """
    The last line, inclusive.
    """
    endLine: Int!
    """
    The side containing the last line.
    """
    endSide: DiffAnchorSide!
}

"""
The side of a diff containing an anchor.
"""
enum DiffAnchorSide {
    BASE
    HEAD
}

"""
Input for batched mark/unmark-viewed mutations. All files in a single call
target the same scope in the same repository. The server does not reload the
comparison on write; a bogus input only affects the submitting user's own rows.
"""
input MarkChangedFilesInput {
    """
    The repository containing the diff.
    """
    repository: ID!
    """
    The scope to mark the files in, of at most 1024 bytes, which
    ChangedFile.viewerHasViewed reads with the same argument.

    Clients must pass a scope. Omitting it uses "<base>...<head>" of the
    comparison given by base and head, which is only supported for clients
    loaded before scopes existed, and will be removed in the next release.
    """
    scope: String
    """
    Deprecated: pass scope instead. The base symbolic ref of the comparison
    (e.g. "main"). If omitted, treated as "HEAD" to match
    repository.comparison. Ignored if scope is set.
    """
    base: String
    """
    Deprecated: pass scope instead. The head symbolic ref of the comparison
    (e.g. "feature"). If omitted, treated as "HEAD" to match
    repository.comparison. Ignored if scope is set.
    """
    head: String
    """
    The files to act on within this scope.
    """
    files: [ChangedFileViewedRef!]!
}

"""
Identity of a single file within a diff: canonical path plus the src and dst
blob OIDs that anchor the viewed state to a specific content snapshot. For
markChangedFilesAsUnviewed, srcOID and dstOID are ignored — a delete only
matches on path.
"""
input ChangedFileViewedRef {
    """
    The canonical path of the file (post-image path, or pre-image if deleted).
    """
    path: String!
    """
    The source (pre-image) blob OID from ChangedFile.srcOID, or null if the
    file was added in this diff.
    """
    srcOID: GitObjectID
    """
    The destination (post-image) blob OID from ChangedFile.dstOID, or null if
    the file was deleted in this diff.
    """
    dstOID: GitObjectID
}

extend type Mutation {
    """
    EXPERIMENTAL: Mark one or more changed files in a diff as viewed for the
    current user. Idempotent. Batch capped at 5000 files.
    """
    markChangedFilesAsViewed(input: MarkChangedFilesInput!): Boolean!
    """
    EXPERIMENTAL: Remove the "viewed" mark from one or more changed files in
    a diff for the current user. Batch capped at 5000 files.
    """
    markChangedFilesAsUnviewed(input: MarkChangedFilesInput!): Boolean!
}
